name: windows
# Windows runs on main, not on a pull request: a run of it held every pull
# request's merge, and a break shows as red on main. It has a workflow of its
# own so its 71 minutes (run 42123777127) hold up nothing else: a job in `test`
# waits only for the runs of `test`, and a run of this one only for the runs of
# this one.
#
# A merge runs the checks and the gating tests, and nothing else. In that run
# the lib step took 64 of the 71 minutes and reported 529 failing tests as a
# warning line, so it gates nothing and a merge cannot wait on it. It runs
# nightly and by hand instead, where its result is read as its own (#1742).
#
# Ported crates and saved state gate Windows. The workspace check, door, ACL
# and lib steps report gaps without gating. `--keep-going` reports every crate
# that fails to compile.
on:
  push:
    branches: [main]
  # GitHub runs a schedule on the default branch alone. 07:00 UTC daily.
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A newer merge replaces a run still waiting its turn here, and never ends
  # one already running. The event name is in the key, so a nightly run is not
  # in the queue a merge's run replaces. In one group for the whole branch, a
  # merge landing while the nightly run waits ends it `cancelled`, and that
  # day's lib run runs nowhere (#1745's review). A nightly run and a merge's
  # run can therefore run side by side, on two Windows runners.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
jobs:
  windows:
    runs-on: windows-11-arm
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install rustup if the image lacks it
        shell: pwsh
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe -OutFile rustup-init.exe
            ./rustup-init.exe -y --default-toolchain none --profile minimal
            "$env:USERPROFILE\.cargo\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          }
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `ring` compiles C with `clang` on `aarch64-pc-windows-msvc`.
      - name: Put LLVM on the PATH
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files\LLVM\bin\clang.exe')) {
            choco install llvm -y --no-progress
          }
          'C:\Program Files\LLVM\bin' | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      # The `git.exe` in Git's `cmd` and `bin` starts this one, about 15 ms a
      # call more, and the tests start git tens of thousands of times (#1578).
      - name: Put Git's own git.exe first on the PATH
        shell: pwsh
        run: |
          $own = 'C:\Program Files\Git\clangarm64\bin'
          if (Test-Path "$own\git.exe") {
            $own | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          }
      # Git starts `git maintenance run --auto` after each fetch and commit,
      # a process start in 11% of the git calls the tests make (#1588). This
      # runs after the step above, so it writes the system config of the git
      # the tests start.
      - name: Turn off git's automatic maintenance
        shell: pwsh
        run: |
          git config --system maintenance.auto false
          git config --system --get maintenance.auto
      # `dog`, `core`, `adapters`, `runner`, the root package and the crates below them compile for Windows, tests included: keep them so.
      - run: cargo check --all-targets --locked -p shep-kelpie-core -p shep-kelpie-dog -p shep-kelpie-process -p shep-kelpie-test-support -p shep-kelpie-facts -p shep-kelpie-owner-only -p shep-kelpie-worker-folder -p shep-kelpie-trim -p shep-kelpie-adapters -p shep-kelpie-runner -p shep-kelpie-tree -p shep-kelpie-disk -p shep-kelpie
      - id: check
        continue-on-error: true
        run: cargo check --workspace --all-targets --locked --keep-going
      - if: steps.check.outcome == 'failure'
        run: |
          echo "::warning title=windows::the workspace check failed on Windows. See the check step's log for compiler diagnostics."
      # The lease door's, the pipe's and the bridge's tests. `dog` compiles for
      # Windows now (#1274), and this step stays non-gating until a run of it
      # passes there.
      - id: door
        continue-on-error: true
        run: 'cargo test --locked -p shep-kelpie-core -p shep-kelpie-dog --lib -- ipc:: bridge lease:: door'
      - if: steps.door.outcome == 'failure'
        run: |
          echo "::warning title=windows::the lease door's test run failed or timed out. See the door step's log for build errors, test failures or unfinished tests."
      # The owner-only ACL: the secret, the answers files and the App's key
      # store. Non-gating until a run of it passes on Windows.
      - id: totp
        continue-on-error: true
        run: 'cargo test --locked -p shep-kelpie-core -p shep-kelpie-owner-only -p shep-kelpie-adapters --lib -- totp:: owner_only:: github::tests::saving_makes github::tests::a_key_others'
      - if: steps.totp.outcome == 'failure'
        run: |
          echo "::warning title=windows::the owner-only ACL's test run failed or timed out. See the totp step's log for build errors, test failures or unfinished tests."
      # What the atomic save settles: the lease book and the state file. Gates.
      - id: save
        run: 'cargo test --locked -p shep-kelpie-core --lib -- lease::saved:: state::tests::release:: state::tests::a_second_atomic_write_over_a_file_replaces_it'
      # Measure every crate's lib tests before fixing each Windows failure group.
      # Skip the tests that hung in runs 40990662373 and 41020519313. The
      # runner's 3035 tests take about two hours here (#1578).
      # Nightly and by hand only (#1742): a push to main is a merge, and this
      # step reports 529 failures, so it gates nothing and is 64 of the job's
      # 71 minutes.
      - id: lib
        if: github.event_name != 'push'
        continue-on-error: true
        timeout-minutes: 180
        run: >-
          cargo test --workspace --lib --locked --no-fail-fast
          --
          --skip upgrade::tests::handover::a_runner_stopped_while_it_hands_over_stays_stopped
          --skip upgrade::tests::sheep::a_runner_stopped_while_the_upgrade_waits_stays_stopped
          --skip runner::ci_help::tests::the_red_prompt_names_the_e2e_command_only_when_configured
          --skip runner::claude_files::tests::a_trigger_is_answered_while_the_changed_files_are_read
          --skip runner::closed::tests::a_trigger_is_answered_while_the_worktree_is_checked_for_work
          --skip runner::contributions::pass_tests::a_pass_past_its_ceiling_ends_unread_and_counts_what_it_spent
      - if: github.event_name != 'push' && steps.lib.outcome == 'failure'
        run: |
          echo "::warning title=windows::the workspace's lib test run failed or timed out. See the lib step's log for build errors, test failures or unfinished tests."
