name: windows timing
on:
  push:
    branches: [kelpie/1578]
permissions:
  contents: read
jobs:
  defender:
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare Git work with Defender path exclusions
        shell: pwsh
        run: |
          Get-Command Add-MpPreference -Syntax
          Get-Command Remove-MpPreference -Syntax
          Get-CimInstance Win32_Processor | Format-List Name, NumberOfLogicalProcessors
          $gitRoot = Split-Path (Split-Path (Get-Command git).Source)
          $paths = @($env:TEMP, $env:GITHUB_WORKSPACE, $gitRoot)
          function Measure-GitWork($label) {
            $repo = Join-Path $env:RUNNER_TEMP "git-$label"
            git init --quiet $repo
            $watch = [Diagnostics.Stopwatch]::StartNew()
            1..50 | ForEach-Object { git --version > $null }
            Write-Output "TIMING $label 50 git --version: $($watch.Elapsed.TotalSeconds) s"
            $watch.Restart()
            1..50 | ForEach-Object { git -C $repo rev-parse --git-dir > $null }
            Write-Output "TIMING $label 50 git rev-parse: $($watch.Elapsed.TotalSeconds) s"
            $watch.Restart()
            1..20 | ForEach-Object { git init --quiet (Join-Path $repo $_) }
            Write-Output "TIMING $label 20 git init: $($watch.Elapsed.TotalSeconds) s"
          }
          Measure-GitWork baseline
          try {
            Add-MpPreference -ExclusionPath $paths -ErrorAction Stop
            Get-MpPreference | Select-Object -ExpandProperty ExclusionPath
            Measure-GitWork excluded
          } finally {
            Remove-MpPreference -ExclusionPath $paths
          }
          Measure-GitWork restored
