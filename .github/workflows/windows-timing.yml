name: windows timing
on:
  push:
    branches: [kelpie/1578]
permissions:
  contents: read
jobs:
  timing:
    runs-on: windows-11-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: 'true'
      - shell: pwsh
        run: |
          'C:\Program Files\LLVM\bin' | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          rustc -vV
          git version --build-options
          Get-Command git, sh, cmd | Format-List Name, Source
          Get-MpComputerStatus | Select-Object AntivirusEnabled, RealTimeProtectionEnabled
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfLogicalProcessors
      - name: Build the test executable once
        shell: pwsh
        run: |
          cargo test --locked -p shep-kelpie-runner --lib --no-run --message-format=json | Tee-Object -FilePath built.json
          $built = Get-Content built.json | ConvertFrom-Json | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'shep_kelpie_runner' -and $_.executable }
          "RUNNER_TEST_EXE=$($built.executable)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Existing runner test with Git trace
        shell: pwsh
        env:
          KELPIE_TEST_TIMING: '1'
        run: |
          $env:GIT_TRACE2_EVENT = Join-Path $env:RUNNER_TEMP git-trace.json
          & $env:RUNNER_TEST_EXE runner::slots_tests::a_full_pending_rulings_opens_nothing_and_its_alert_counts_the_rulings --nocapture --test-threads=1
          Get-Content $env:GIT_TRACE2_EVENT | ForEach-Object {
            $event = $_ | ConvertFrom-Json
            if ($event.event -in 'start', 'exit') { $_ }
          }
      - name: Serial and parallel module timings
        shell: pwsh
        run: |
          $selected = @('runner::slots_tests::', '--skip', 'an_answered_ruling_waits_for_the_slot_and_goes_before_a_new_issue', '--skip', 'a_still_red_yes_goes_to_ci_with_every_slot_taken', '--skip', 'an_attach_takes_a_free_slot_for_an_item_going_on_without_one')
          & $env:RUNNER_TEST_EXE @selected --test-threads=1
          & $env:RUNNER_TEST_EXE @selected --test-threads=4
          & $env:RUNNER_TEST_EXE @selected --test-threads=32
      - name: Git launcher and direct binary timings
        shell: pwsh
        run: |
          $execPath = git --exec-path
          Write-Output "Git exec path: $execPath"
          $gitRoot = Split-Path (Split-Path (Get-Command git).Source)
          $candidates = @((Get-Command git).Source) + @(Get-ChildItem $gitRoot -Filter git.exe -Recurse | Select-Object -ExpandProperty FullName)
          foreach ($git in ($candidates | Select-Object -Unique)) {
            1..3 | ForEach-Object {
              $watch = [Diagnostics.Stopwatch]::StartNew()
              & $git --version
              Write-Output "TIMING $git $($watch.Elapsed.TotalMilliseconds) ms"
            }
          }
      - name: Repeat with Defender path exclusions
        shell: pwsh
        run: |
          Get-Help Add-MpPreference -Parameter ExclusionPath
          $paths = @($env:TEMP, $env:GITHUB_WORKSPACE)
          try {
            Add-MpPreference -ExclusionPath $paths -ErrorAction Stop
            Get-MpPreference | Select-Object -ExpandProperty ExclusionPath
            $selected = @('runner::slots_tests::', '--skip', 'an_answered_ruling_waits_for_the_slot_and_goes_before_a_new_issue', '--skip', 'a_still_red_yes_goes_to_ci_with_every_slot_taken', '--skip', 'an_attach_takes_a_free_slot_for_an_item_going_on_without_one')
            & $env:RUNNER_TEST_EXE @selected --test-threads=4
            & $env:RUNNER_TEST_EXE windows_timing_probe --nocapture --test-threads=1
          } finally {
            Remove-MpPreference -ExclusionPath $paths
          }
