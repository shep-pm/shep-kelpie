name: test
# One crate, no features, no integration tier yet: one job answers each
# gate. Every job carries `timeout-minutes`, a ceiling against a hang
# rather than a performance budget. GitHub's default when absent is 360.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  private-names:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-private.sh
        env:
          PRIVATE_NAMES: ${{ secrets.PRIVATE_NAMES }}

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - run: cargo doc --no-deps --locked
    env:
      RUSTDOCFLAGS: -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - run: cargo test --locked

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Matches `rust-version` in Cargo.toml, which matches shep's.
      - run: rustup toolchain install 1.88 --profile minimal
      - run: cargo +1.88 check --all-targets --locked
