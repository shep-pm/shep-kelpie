name: test
# A workspace of crates and the root package, no integration tier yet: one
# job answers each gate. Every job carries `timeout-minutes`, a ceiling
# against a hang rather than a performance budget. GitHub's default when
# absent is 360.
#
# Every Rust job restores `Swatinem/rust-cache` after its toolchain install,
# so the key sees the toolchain that builds. Only main saves, so a pull
# request reads main's build and the repo's cache budget holds one per job.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
jobs:
  # Decides whether a pull request changed anything a Rust job reads, so a
  # prose-only change skips them. A skipped job reports as skipped, which
  # kelpie and GitHub read as passed. Every other event runs every job, and a
  # failed decision does too, since its output is then empty.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.rust.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      # A pull request's checkout is its merge commit, whose first parent is the base.
      - id: rust
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD | scripts/ci-changes.sh >> "$GITHUB_OUTPUT"
          else
            echo rust=true >> "$GITHUB_OUTPUT"
          fi

  lint:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: scripts/no-tmp-tempdir.sh
      - run: scripts/ticket-port.sh

  private-names:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check-private.sh
        env:
          PRIVATE_NAMES: ${{ secrets.PRIVATE_NAMES }}

  # The prose checks run on every change, and rustdoc only when Rust may have.
  docs:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/design-size.sh
      - run: scripts/readme-size.sh
      - run: scripts/docs-links.py
      - run: scripts/parity-gaps.sh
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
      - if: needs.changes.outputs.rust != 'false'
        run: rustup toolchain install stable --profile minimal
      - if: needs.changes.outputs.rust != 'false'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: needs.changes.outputs.rust != 'false'
        run: cargo doc --no-deps --locked
    env:
      RUSTDOCFLAGS: -D warnings

  # `cargo test --locked` in three parts that run at once, split in
  # scripts/test-part.sh. Each part keys its own cache, since each builds a
  # different set of test targets.
  test:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: part-${{ matrix.part }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: scripts/test-part.sh ${{ matrix.part }}

  # The tests `#[ignore]`d for needing a real shepherd. One of them is the
  # only test that sees shep answer `NotFound`, which the fake shepherd
  # cannot send.
  real-shepherd:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The version in `SHEP_VERSION` (crates/core/src/shepherd/mod.rs) and Cargo.toml.
      SHEP_VERSION: 0.16.1
      KELPIE_TEST_SHEP: ${{ github.workspace }}/.shep/shep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install the pinned shep
        run: |
          asset=shep-x86_64-unknown-linux-gnu
          base=https://github.com/shep-pm/shep/releases/download/shep-v${SHEP_VERSION}
          mkdir -p .shep
          curl -fsSL --retry 3 -o ".shep/$asset.tar.gz" "$base/$asset.tar.gz"
          curl -fsSL --retry 3 -o ".shep/$asset.sha256" "$base/$asset.sha256"
          (cd .shep && sha256sum --check "$asset.sha256" && tar -xzf "$asset.tar.gz")
          test "$("$KELPIE_TEST_SHEP" --version | head -n 1)" = "shep ${SHEP_VERSION}"
      # A test binary that matches nothing passes, so the run must show
      # tests that passed; a failing test fails the step on its own.
      - name: Run the real-shepherd tests
        run: |
          set -o pipefail
          cargo test --locked -p shep-kelpie --test dog_smoke -- --ignored | tee dog_smoke.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed' dog_smoke.log

  # The tests `#[ignore]`d for running the real sandbox, run under crabpot
  # on Linux, where bubblewrap fences the worker. They skip the two that need
  # a login or pi.
  sandbox:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    # Pinned: on ubuntu-26.04 the sysctl below is not enough, and crabpot's
    # unshare of the PID and mount namespaces fails with EPERM.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install what the sandbox needs on Linux
        run: sudo apt-get update && sudo apt-get install -y bubblewrap ripgrep
      # Ubuntu 24.04 runners block unprivileged user namespaces, which
      # bubblewrap needs to build the sandbox.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The toolchains of `fixtures/ecosystems`, which the ecosystem tests
      # copy into a fake home the fence denies. Each version is pinned, so a
      # new release cannot change what a worker's fence is tried against.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.12.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # crabpot is in kelpie's own binary, so the sandbox needs no installed
      # runtime here.
      - run: cargo test --locked --no-run
      # A filter that matches nothing passes, and so does one that matches
      # only some tests, so the run must show each test below as passed. A
      # failing test fails the step on its own. A test given a Linux-only
      # `ignore` for a gap in the fence (see #214) comes off this list.
      # The socket test runs on Linux alone, so it is listed here and nowhere
      # a macOS run reads.
      - name: Run the sandbox tests
        run: |
          set -o pipefail
          cargo test --locked -- --ignored \
            adapters::claude::escapes \
            adapters::claude::ecosystems \
            adapters::pi::ecosystems \
            a_worker_reaches_the_model_only_through_a_forwarder_that_passes_chat \
            --skip a_live_worker_turn_runs_inside_the_sandbox_and_resumes \
            --skip pi_answers_through_the_forwarder_with_no_model_host_in_its_sandbox \
            | tee sandbox.log
          for name in \
            the_worktree_the_build_folder_and_the_transcripts_are_written_and_nothing_outside \
            a_worker_reads_its_own_folders_and_no_other_repo_of_the_home \
            claude_codes_own_files_are_refused_in_any_case_and_spelling \
            a_nested_claude_folder_that_existed_at_call_start_is_refused \
            codexs_own_files_are_refused_in_any_case \
            a_socket_the_policy_lists_is_still_refused_on_linux \
            a_host_not_allowed_and_a_socket_not_listed_are_refused \
            a_worker_reaches_the_model_only_through_a_forwarder_that_passes_chat; do
            grep -Eq "^test .*::${name} \.\.\. ok$" sandbox.log \
              || { echo "::error::$name did not run and pass"; exit 1; }
          done
          # Both harnesses run each of these, so each is named by its module.
          for harness in claude pi; do
            for name in \
              a_rust_project_builds_tests_lints_and_pushes_inside_the_fence \
              a_go_project_builds_tests_lints_and_pushes_inside_the_fence \
              a_bun_project_installs_tests_and_pushes_inside_the_fence \
              an_npm_project_installs_tests_and_pushes_inside_the_fence \
              a_hook_script_loads_its_neighbours_inside_the_fence; do
              grep -Eq "^test adapters::${harness}::ecosystems::${name} \.\.\. ok$" sandbox.log \
                || { echo "::error::$harness $name did not run and pass"; exit 1; }
            done
          done

  msrv:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Matches `rust-version` in Cargo.toml, which matches shep's.
      - run: rustup toolchain install 1.88 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo +1.88 check --all-targets --locked

  # Reports whether the workspace compiles on Windows while #241 ports it
  # crate by crate. `--keep-going` reports every failing crate, not the
  # first. The check step's `continue-on-error` keeps the job green while
  # #241 is open, and a warning says when it failed. On the job it would
  # still post a red check, which kelpie reads as a failed run and holds
  # every pull request on. Drop it, and add the job to the ruleset's
  # required checks, when #241 is done.
  windows:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install rustup if the image lacks it
        shell: pwsh
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe -OutFile rustup-init.exe
            ./rustup-init.exe -y --default-toolchain none --profile minimal
            "$env:USERPROFILE\.cargo\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          }
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `ring` compiles C with `clang` on `aarch64-pc-windows-msvc`.
      - name: Put LLVM on the PATH
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files\LLVM\bin\clang.exe')) {
            choco install llvm -y --no-progress
          }
          'C:\Program Files\LLVM\bin' | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      # `dog`, `core`, `adapters`, `runner`, the root package and the crates below them compile for Windows, tests included: keep them so.
      - run: cargo check --all-targets --locked -p shep-kelpie-core -p shep-kelpie-dog -p shep-kelpie-process -p shep-kelpie-test-support -p shep-kelpie-facts -p shep-kelpie-owner-only -p shep-kelpie-worker-folder -p shep-kelpie-trim -p shep-kelpie-adapters -p shep-kelpie-runner -p shep-kelpie-tree -p shep-kelpie-disk -p shep-kelpie
      - id: check
        continue-on-error: true
        run: cargo check --workspace --all-targets --locked --keep-going
      - if: steps.check.outcome == 'failure'
        run: |
          echo "::warning title=windows::cargo check fails on Windows until #241 is done. The check step's log names each crate."
      # The lease door's, the pipe's and the bridge's tests. `dog` compiles for
      # Windows now (#1274), and this step stays non-gating until a run of it
      # passes there.
      - id: door
        continue-on-error: true
        run: 'cargo test --locked -p shep-kelpie-core -p shep-kelpie-dog --lib -- ipc:: bridge lease:: door'
      - if: steps.door.outcome == 'failure'
        run: |
          echo "::warning title=windows::the lease door's tests do not pass on Windows yet. The step's log names each failing test."
      # The owner-only ACL: the secret, the answers files and the App's key
      # store. Non-gating until a run of it passes on Windows.
      - id: totp
        continue-on-error: true
        run: 'cargo test --locked -p shep-kelpie-core -p shep-kelpie-owner-only -p shep-kelpie-adapters --lib -- totp:: owner_only:: github::tests::saving_makes github::tests::a_key_others'
      - if: steps.totp.outcome == 'failure'
        run: |
          echo "::warning title=windows::the owner-only ACL's tests do not pass on Windows yet. The step's log names each failing test."
      # What the atomic save settles: the lease book and the state file. Gates.
      - id: save
        run: 'cargo test --locked -p shep-kelpie-core --lib -- lease::saved:: state::tests::release:: state::tests::a_second_atomic_write_over_a_file_replaces_it'
