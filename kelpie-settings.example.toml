# Kelpie's own settings, shared by every project: its `[kelpie]` section of
# `dogs.toml` in kelpie's shepherd's home, which lookout edits in the dog's
# pane and draws the URL `<set>`. Every key is optional.

[kelpie]
# How rulings reach the maintainer: `webhook`, `relay` (the Claude app on the
# phone) or both. A project's own `ruling_channels` wins over this. Both when
# neither says. At least one is required.
# ruling_channels = ["webhook", "relay"]

# The folder holding kelpie's own Codex login, apart from your `~/.codex`,
# which no call reads. Sign it in once with
# `CODEX_HOME=$SHEP_HOME/kelpie/codex codex login --device-auth`. Every Codex
# call runs on a home of its own with the login linked in. Kelpie's home's
# `codex` when absent; a leading `~/` is the home folder. A runner reads it
# when it starts.
# codex_home = "~/.kelpie/shep/kelpie/codex"

# The GPU's Prometheus metrics page, such as `nvidia_gpu_exporter`'s
# `/metrics`. `status` shows the GPU's load, memory, power and temperature
# from it, and says why when the page cannot be read. Nothing is read when
# absent.
# gpu_metrics_url = "http://gpu-box:9835/metrics"

# Where the webhook posts a ruling, so the maintainer hears of it away from
# the terminal. Needed only by a project whose rulings go to the webhook.
# `kind` is `discord` (a channel's webhook URL) or `ntfy` (a topic's URL); both
# keys are required. The URL is a credential: anyone holding it can post, or
# read an ntfy topic. Keep `dogs.toml` private.
#
# On ntfy a ruling is answered in the topic too: reply with the line the
# alert ends on, `<project> <id> yes <code>`, with the code from your
# authenticator app last. Run `shep kelpie totp` once to get the secret to scan.
# A reader of the topic can read rulings but not answer them. Five wrong
# codes turn answers off until `shep kelpie totp --unlock`.
[kelpie.webhook]
kind = "ntfy"
url = "https://ntfy.sh/your-private-topic"

# The pull request reviewers a project may list, each by its window: so many
# reviews in so many hours, account-wide, which the dog holds. CodeRabbit is
# defined with one review an hour when absent, and its review footers raise
# that. cubic is listed only once defined here. Its free plan gives a
# private repo 20 reviews a month; a public repo draws on a fair-use pool of
# reviewed lines it does not publish. Codex is listed only once defined here
# too, with the weekly allowance its plan gives code reviews, which is the
# window its "usage limits for code reviews" reply parks it for; its
# reviews run on the ChatGPT plan, not the repo's. `reviews_on_ready` says
# Codex reviews a pull request when it leaves draft, as the repo's Codex
# settings may have it: then marking ready is the summon, taken under the
# lease with no comment, since a comment on top would spend a second review
# the window does not count. Off when absent, since it was never seen to:
# turn it on only where Codex's automatic reviews are enabled, and kelpie
# otherwise summons by comment. A round that goes
# to another reviewer still marks the draft ready, so turn Codex's automatic
# reviews off to keep it out of those. The dog reads these when it starts.
# [kelpie.reviewers.coderabbit]
# reviews = 1
# hours = 1
#
# [kelpie.reviewers.cubic]
# reviews = 20
# hours = 720
#
# [kelpie.reviewers.codex]
# reviews = 10
# hours = 168
# reviews_on_ready = false

# How many commands may hold the `cargo-test` lease at once, 3 when absent.
# A worker runs its test suite under it, as does anything on this machine
# that runs `shep kelpie lease run cargo-test -- <command>`, and the rest
# queue. The dog reads this when it starts.
# [kelpie.leases]
# cargo-test = 3

# The agents a project may name for its worker, reviewer and judge, and its
# session reviewers: a harness, and the model and effort it runs on. The
# harnesses are Claude Code, `claude-code`, pi, `pi`, and Codex, `codex`.
#
# `usage` is how its usage is read, and so which account paces it: `claude`
# (`/usage`, the default on Claude Code), `codex` (Codex's own windows), or
# `none` for a local model, which is never paced and holds `lease` for each
# whole call instead. `lease` defaults to `gpu`, the qwen scripts' lock.
# It must be the harness's own reader: Claude Code takes only `claude`, pi
# only `none` and Codex only `codex`.
# [kelpie.agents.opus-high]
# harness = "claude-code"
# model = "claude-opus-5-5"
# effort = "high"
#
# pi runs a model on an OpenAI-compatible server: `url`, its `http://`
# address up to and including its `/v1`, and `context`, the context size in
# tokens it gives the model. Its calls reach the server through a forwarder
# that passes only the chat completions call. A
# project's local worker takes only issues labelled `worker:local`.
# [kelpie.agents.qwen]
# harness = "pi"
# model = "qwen3.8:27b"
# effort = "medium"
# url = "http://<host>:11434/v1"
# context = 65536
#
# Codex runs on kelpie's own ChatGPT login, in `codex_home` above, paced by
# that plan's 5-hour and weekly windows. Its worker runs no preview and no
# `worker.guard_hooks`. `codex debug models` lists the plan's models.
# [kelpie.agents.gpt]
# harness = "codex"
# model = "gpt-6.1-sol"
# effort = "medium"


# The review loop's reviewers a project may list in `review.reviewers`, by
# name. `claude` is always the project's own Claude round, so it is not
# defined here. The README says what each kind does.
#
# `command` runs a command that keeps the README's contract, here the
# maintainer's qwen-review script. A leading `~/` is the home folder.
# `endpoint` is kelpie's own reviewer: any OpenAI-compatible server (Ollama,
# LM Studio, llama.cpp's server), its model, and the context size the server
# gives that model, in tokens. `claude` is a fresh Claude session on its own
# model and effort, and `session` a fresh session on the agent its `agent`
# names from `[kelpie.agents]` above. A missing command or an unreachable
# endpoint stops the runner of a project that lists it.
#
# `lease` is the lock kelpie holds around each round. `gpu` is this
# machine's GPU lock, the one the qwen scripts take, so leave it off for a
# command that takes that lock itself, as the script does. Any other name
# is a lock of its own, so a reviewer on another machine's GPU never waits
# on this one's. With a lease, before a round against Ollama, kelpie reads
# the host's `/api/ps`: a model partly or wholly on the CPU fails the round
# and raises a ruling. An endpoint's host is its url. A command names its
# host with `ollama` and may name its model with `ollama_model`, else every
# model the host has loaded is checked.
#
# `paths` limits a reviewer to pull requests that change a file under one of
# its globs. Every reviewer's prompt carries the issue's acceptance criteria.
# [kelpie.local_reviewers.qwen]
# kind = "command"
# command = "~/.claude/scripts/qwen-review.sh"
#
# [kelpie.local_reviewers.gpu-box]
# kind = "endpoint"
# url = "http://gpu-box:11434/v1"
# model = "qwen2.5-coder:14b"
# context = 32768
# lease = "gpu-box"
#
# [kelpie.local_reviewers.opus]
# kind = "claude"
# model = "claude-opus-5-5"
# effort = "high"
# paths = ["src/runner/merge/**", "src/guard/**", "src/totp.rs"]
