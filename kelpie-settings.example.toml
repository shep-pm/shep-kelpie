# Kelpie's own settings, shared by every project: its `[kelpie]` section of
# `dogs.toml` in kelpie's shepherd's home, which lookout edits in the dog's
# pane and draws the URL `<set>`. Every key is optional.

[kelpie]
# The folder holding kelpie's own Codex login, apart from your `~/.codex`,
# which no call reads. Sign it in once with
# `CODEX_HOME=$SHEP_HOME/kelpie/codex codex login --device-auth`. Every Codex
# call runs on a home of its own with the login linked in. Kelpie's home's
# `codex` when absent; a leading `~/` is the home folder. A runner reads it
# when it starts.
# codex_home = "~/.shep/kelpie/codex"

# The GPU's Prometheus metrics page, such as `nvidia_gpu_exporter`'s
# `/metrics`. `status` shows the GPU's load, memory, power and temperature
# under `gpu`, read every 15 seconds, and says why when the page cannot be
# read. Nothing is read when
# absent.
# gpu_metrics_url = "http://gpu-box:9835/metrics"

# Where the webhook posts a ruling, so the maintainer hears of it away from
# the terminal. Without it a ruling reaches you only in the log, `status`
# and `shep kelpie rule`.
# `kind` is `discord` (a channel's webhook URL) or `ntfy` (a topic's URL); both
# keys are required. The URL is a credential: anyone holding it can post, or
# read an ntfy topic. Keep `dogs.toml` private.
#
# On ntfy a ruling is answered in the topic too: reply with the line the
# alert ends on, `<project> <id> yes <code>`, with the code from your
# authenticator app last. Run `shep kelpie totp` once to get the secret to scan.
# A reader of the topic can read rulings but not answer them. Five wrong
# codes turn answers off until `shep kelpie totp --unlock`.
#
# A self-hosted ntfy is reached in three more setups. On a tailnet the `url`
# may be `http://` when its host is a Tailscale address (100.64.0.0/10) or a
# `.ts.net` name, since the tailnet encrypts it; any other `http://` host
# (besides this machine) is refused, and so is a URL with a user name or
# password in it. `ca_cert` is the absolute path of the private CA's
# certificate file that curl trusts for the post and for reading replies, and
# the dog will not start when it cannot be read, saying `webhook.ca_cert` is
# the key. `token` is an access token (`ntfy token add`), sent as
# `Authorization: Bearer <token>` on every post and every read of replies
# (on `kind = "ntfy"` only).
# The token is a credential like the URL, and no error, log line or status
# shows it.
#
# `trusted = true` is your word that the server lets only that token post to
# the topic (an `ntfy access` rule denying everyone else), so a reply there is
# yours; kelpie cannot see the server's rules. Replies then need no code
# (`14 no <note>`, `14 rework <note>`, a yes on any ruling but a merge, and a
# worker's answer), except a yes on a merge ruling, which still takes it,
# since the topic alone never merges. It needs a `token`, and the dog will not
# start without one, saying `webhook.trusted` is the key. Five wrong codes
# still turn coded answers off, and replies that need no code go on working.
# The alert's last line shows the reply each ruling takes, and
# `shep kelpie doctor` prints a `replies` line while the topic is trusted.
# Without `trusted`, every reply needs the authenticator code.
# `shep kelpie doctor --test-alert` posts a test through these settings.
[kelpie.webhook]
kind = "ntfy"
url = "https://ntfy.sh/your-private-topic"
# url = "http://ntfy.your-tailnet.ts.net/your-private-topic"
# ca_cert = "/etc/kelpie/ca.pem"
# token = "tk_..."
# trusted = true

# A model gateway, such as paddock, by name. An agent file names it as
# `gateway: paddock` in place of its server's `url`, with the model's name as
# the gateway knows it. `url` is the gateway's own `http://` address, with
# its OpenAI routes under `/v1`. `key_env` names the variable in the
# runner's environment holding the key the gateway gave kelpie: no agent
# call sees that variable, and no file kelpie writes holds the key. Kelpie
# takes no lease for a model behind a gateway, which queues its calls itself.
# A runner reads its gateways when it starts.
# `kind` says how kelpie talks to it beyond chat, `paddock` when absent and
# the only kind so far.
# [kelpie.gateways.paddock]
# kind = "paddock"
# url = "http://gpu-box:8700"
# key_env = "PADDOCK_KEY"

# How many commands may hold the `cargo-test` lease at once, 3 when absent.
# A worker runs its test suite under it, as does anything on this machine
# that runs `shep kelpie lease run cargo-test -- <command>`, and the rest
# queue. The dog reads this when it starts, so after a change run
# `shep restart kelpie`.
# [kelpie.leases]
# cargo-test = 3

# Agents are not settings: each is a file of its own, `agents/<name>.md` in
# kelpie's home (`$SHEP_HOME/kelpie/agents/`), YAML frontmatter then a
# Markdown body. Kelpie ships `sonnet-high` and `opus-high`, which build,
# and `defect-hunter-lite`, `defect-hunter` and `iq3-xxs-review`, which
# review, and `shep kelpie add` writes them out and never overwrites one.
# `iq3-xxs-review` runs on a gateway named `paddock`; it is first in the
# default contribution pass only where this file holds that gateway. Kelpie
# writes `qwen`, a reviewer that runs the
# maintainer's qwen-review script, only where that script is installed. The
# agent board picks each work item's implementer from the files below whose
# role is `implementer`, and every reviewer file the project's `agents.allow`
# holds, apart from `contributions.security_reviewer`, is a candidate for
# each review round. Each round is the agent board's pick toward
# `reviews.need`, once per reviewer, ending sooner when no candidate can run.
# The count is a project setting, in its Flockfile, not this file:
#
# [app.dogs.kelpie.reviews]
# need = 2
#
# An issue's `agent:<name>!` label
# runs it on the implementer it names. The
# agents guide describes every key:
# https://github.com/shep-pm/shep-kelpie/blob/main/docs/guide/agents.md
# An implementer's body is added to kelpie's own instructions; a pi
# implementer, for one, reads:
#
#   ---
#   role: implementer
#   harness: pi
#   model: qwen3.8:27b
#   effort: medium
#   url: http://<host>:11434/v1
#   context: 65536
#   ---
#
#   Run the narrowest test that covers the change.
#
# A reviewer's body is its prompt, with `{{BASE}}` and `{{DIFF}}` where the
# commit the change is against and the diff go, and kelpie adds the issue's
# acceptance criteria. It runs a fresh session on `claude-code`, `codex` or
# `pi`, which reads the worktree and runs no command; `paths` limits it to
# pull requests that change a file under one of its globs, and
# `second_look: true` runs it twice before the one fix turn, the second
# time shown what the first found:
#
#   ---
#   role: reviewer
#   harness: claude-code
#   model: claude-opus-5-5
#   effort: high
#   paths: ["src/runner/merge/**", "src/guard/**"]
#   ---
#
#   Read the change against {{BASE}} for defects in merging ...
#
# Or it runs on its own, with no body. `harness: command` runs a command
# that keeps the contract in
# https://github.com/shep-pm/shep-kelpie/blob/main/docs/guide/review.md#local-reviewers,
# its path in `command` with a leading `~/` for the home folder. `harness: endpoint` is kelpie's own reviewer:
# any OpenAI-compatible server (Ollama, LM Studio, llama.cpp's server) as
# `url`, its `model`, and the context size the server gives that model, in
# tokens, as `context`:
#
#   ---
#   role: reviewer
#   harness: endpoint
#   url: http://gpu-box:11434/v1
#   model: qwen2.5-coder:14b
#   context: 32768
#   ---
#
# A model reached by `url` is not queued: kelpie holds no lock around it, so
# put a server shared with other callers behind a `gateway` (see
# `[kelpie.gateways]`). A `lease` key in an agent file is refused. A missing
# command or an unreachable endpoint stops the runner of a project that
# names it in `agents.allow`.
#
# A pull request review bot is a reviewer too, on `harness: bot`. Kelpie
# ships `coderabbit`, `cubic` and `codex`, which `add` writes out. Each is a
# candidate wherever `agents.allow` holds it; absent or empty, that setting
# allows every agent. A bot's file is named for it and holds its
# window, so many `reviews` in so many `hours`, account-wide: the dog books
# each bot's window from its file when it starts, so after a change to one
# run `shep restart kelpie`, and holds the bot's lease by it. CodeRabbit's is one an hour, which its review footers raise. cubic's
# free plan gives a repo GitHub marks private 20 reviews a month, and a
# public repo draws on a fair-use pool of reviewed lines. Codex's is the
# weekly allowance its plan gives code reviews, which its "usage limits"
# reply holds it for. If picked, a bot reads once a pass. A closed window is
# passed over at the pick. A bot that has never reviewed on the repo and
# does not answer, or CodeRabbit on a repo that is not public, is left out
# of picks for 7 days and returns sooner if kelpie sees it reviewing.
# Only a public repo can name `coderabbit` in `agents.allow`.
# `rounds` is the most reads it makes of a work item's pull request, whatever its
# passes. Codex's `reviews_on_ready: true` says it reviews a pull request
# when it leaves draft, as the repo's Codex settings may have it: then
# marking ready, under its lease, is the summon, with no comment, since a
# comment on top would spend a second review the window does not count.
# A runner refuses `contributions.reviewers` with another bot before it,
# whose mark-ready would draw its review outside its lease, and never asks it again by
# comment. Leave it off unless Codex's automatic reviews are on. A bot
# writes its own
# prompt, so the body stays empty:
#
#   ---
#   role: reviewer
#   harness: bot
#   bot: cubic
#   reviews: 20
#   hours: 720
#   ---
