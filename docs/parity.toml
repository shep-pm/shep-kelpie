claude-code = "yes"
pi = "yes"
codex = "yes"
goose = "yes"

[harness.pm]
what = "Runs the project manager"
claude-code = "yes"
pi = { cannot = "a Claude Code hook holds its writes to its notes", doc = "crates/core/src/agents/front/mod.rs", says = "a Claude Code hook is what holds its writes to its notes" }
codex = { cannot = "a Claude Code hook holds its writes to its notes", doc = "crates/core/src/agents/front/mod.rs", says = "a Claude Code hook is what holds its writes to its notes" }
goose = { cannot = "a Claude Code hook holds its writes to its notes", doc = "crates/core/src/agents/front/mod.rs", says = "a Claude Code hook is what holds its writes to its notes" }

[harness.guard-hooks]
what = "Runs `worker.guard_hooks`"
claude-code = "yes"
pi = { cannot = "they are Claude Code hooks; the `hooks` setting runs on every harness", doc = "docs/design/fence.md", says = "`guard_hooks` reach Claude Code alone" }
codex = { cannot = "they are Claude Code hooks; the `hooks` setting runs on every harness", doc = "docs/design/fence.md", says = "`guard_hooks` reach Claude Code alone" }
goose = { cannot = "they are Claude Code hooks; the `hooks` setting runs on every harness", doc = "docs/design/fence.md", says = "`guard_hooks` reach Claude Code alone" }

[harness.after-command]
what = "Runs the project's `after_command` hooks on a worker's command results"
claude-code = "yes"
pi = "yes"
codex = "yes"
goose = { cannot = "goose's PostToolUse payload carries no result and its hook output never reaches the model", doc = "docs/design/agents.md", says = "goose cannot run an `after_command` hook" }

[harness.boundary-pause]
what = "`shep kelpie pause` ends a worker turn at its next tool result"
claude-code = "yes"
pi = "yes"
codex = { cannot = "Codex has no hook that ends a turn at a tool result", doc = "docs/design/workers.md", says = "a Codex or goose call keeps the old pause" }
goose = { cannot = "goose has no hook that ends a turn at a tool result", doc = "docs/design/workers.md", says = "a Codex or goose call keeps the old pause" }

[harness.browser]
what = "A worker's turn drives the project's browser through the filtered `playwright` MCP bridge"
claude-code = "yes"
pi = "yes"
codex = "yes"
goose = "yes"

[harness.resumed-servers]
what = "A resumed call loads the MCP servers of the call, not those its session began with"
claude-code = "yes"
pi = "yes"
codex = "yes"
goose = { cannot = "goose keeps the extensions a session began with and ends the run over a name given again", doc = "docs/design/browser.md", says = "A session that began without a browser stays without one" }

[harness.tool-allow-list]
what = "An agent file's `tools` names the tools a call may use"
claude-code = "yes"
pi = { cannot = "pi's tools follow the call's reach", doc = "crates/core/src/agents/front/mod.rs", says = "only claude-code has an allow-list to name" }
codex = { cannot = "Codex has no tool allow-list", doc = "crates/core/src/agents/front/mod.rs", says = "only claude-code has an allow-list to name" }
goose = { cannot = "goose has no tool allow-list", doc = "crates/core/src/agents/front/mod.rs", says = "only claude-code has an allow-list to name" }

[harness.local-model]
what = "Runs on a model an OpenAI-compatible server or a gateway serves"
claude-code = { gap = 647 }
pi = "yes"
codex = { cannot = "Codex runs on the ChatGPT account it is logged in to", doc = "docs/design/agents.md", says = "ChatGPT plan windows beside Claude's" }
goose = "yes"

[harness.doctor]
what = "`shep kelpie doctor` checks the harness is installed and logged in"
claude-code = "yes"
pi = "yes"
codex = "yes"
goose = "yes"

[review-bot]
providers = ["coderabbit", "cubic", "codex"]

[review-bot.summon-by-label]
what = "A label summons it"
coderabbit = "yes"
cubic = { cannot = "cubic is summoned by a comment", doc = "docs/facts/cubic.md", says = "`@cubic-dev-ai review` in a comment summons it" }
codex = { cannot = "Codex is summoned by a comment or by marking ready", doc = "docs/facts/codex.md", says = "a bot that reviews on ready is summoned by marking ready" }

[review-bot.full-review]
what = "A comment asks it to read the whole pull request again"
coderabbit = "yes"
cubic = "yes"
codex = "yes"

[review-bot.private-repos]
what = "Reviews a repo that is not public"
coderabbit = { cannot = "its free plan reviews public repos only", doc = "docs/facts/coderabbit.md", says = "The free plan reviews public repos only." }
cubic = "yes"
codex = "yes"

[webhook]
providers = ["discord", "ntfy"]

[webhook.replies]
what = "The maintainer answers a ruling by replying to its alert"
discord = { cannot = "a Discord webhook cannot read its channel", doc = "docs/facts/worker-questions-and-the-webhook.md", says = "So kelpie reads ruling replies on an ntfy topic alone." }
ntfy = "yes"

[webhook.token]
what = "Kelpie sends a token beside the URL"
discord = { cannot = "a Discord webhook's URL is its credential", doc = "docs/design/rulings.md", says = "URL is a credential" }
ntfy = "yes"

[gateway]
providers = ["paddock", "openai"]

[gateway.lease]
what = "A call holds a lease on its model, so nothing evicts it mid-turn"
paddock = "yes"
openai = { cannot = "an OpenAI-compatible gateway knows nothing of leases", doc = "docs/design/agents.md", says = "no lease, so it may evict a model a turn runs on" }

[gateway.lease-availability]
what = "Kelpie checks shared lease-turn availability before opening a labelled item"
paddock = "yes"
openai = { cannot = "an OpenAI-compatible gateway exposes no lease-turn status", doc = "docs/design/waits-and-spend.md", says = "OpenAI gateways expose no lease-turn status and count as free." }
