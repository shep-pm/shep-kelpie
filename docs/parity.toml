# What each provider kelpie supports can do, one table per category.
#
# `crates/core/src/parity/mod.rs` checks this file on every CI run:
# - each category lists exactly the providers the code has;
# - each row has a cell for every provider in its category;
# - a code path that branches on some providers of a category names its row
#   with a `// parity: <category>.<row>` comment, on its line or the three
#   above (a wildcard `_ =>` arm after a provider's arm counts as a branch);
# - an adapter's `refuse_unsupported` names the rows its provider lacks the
#   same way;
# - a harness row with `methods` lists `Agents` methods that have a refusing
#   default, and its cells say which adapters override them. `CliAdapter`
#   implements them all, so an adapter overrides one by the `Cli` method that
#   answers it (`cli_hooks` in `crates/core/src/parity/tests.rs`).
#
# A cell is one of:
#   "yes"
#   { gap = <n> }   the open issue that adds it, by number
#   { cannot = "why", doc = "<repo path>", says = "<words that file holds>" }

[harness]
providers = ["claude-code", "pi", "codex", "goose"]

[harness.handover]
what = "A worker turn in flight crosses a runner handover"
methods = ["adoption", "adopt"]
claude-code = "yes"
pi = "yes"
codex = "yes"
goose = "yes"

[harness.watch]
what = "`shep kelpie watch` follows a call's transcript"
methods = ["transcript"]
claude-code = "yes"
pi = "yes"
codex = "yes"
goose = "yes"

[harness.idle-watch]
what = "The idle watch reads when a call last showed something"
methods = ["last_active"]
claude-code = "yes"
pi = "yes"
codex = "yes"
goose = "yes"

[harness.attach]
what = "`shep kelpie attach` resumes a worker's session in the terminal"
methods = ["foreground"]
claude-code = "yes"
pi = "yes"
codex = "yes"
goose = "yes"

[harness.attach-ends]
what = "The end of a terminal session drops what the harness kept for it"
methods = ["foreground_ended"]
claude-code = { cannot = "its terminal session keeps nothing the runner holds", doc = "docs/design-log.md", says = "a no-op by default" }
pi = "yes"
codex = "yes"
goose = "yes"

[harness.compaction]
what = "A turn reports its context size and compacts at the compact window"
claude-code = "yes"
pi = "yes"
codex = "yes"
goose = "yes"

[harness.plugin-skills]
what = "A call loads the skills of every plugin it is given"
claude-code = "yes"
pi = "yes"
codex = "yes"
goose = "yes"

[harness.mcp-servers]
what = "A call loads the MCP servers of the repo, its plugins and the code graph"
claude-code = "yes"
pi = "yes"
codex = "yes"
goose = "yes"

[harness.mcp-tool-calls]
what = "A call's tool calls to each MCP server are counted from its transcript once it ends"
claude-code = "yes"
pi = "yes"
codex = { gap = 1279 }
goose = { gap = 784 }

[harness.mcp-failures]
what = "A call's MCP servers that failed to connect are counted and noted from its transcript once it ends"
claude-code = "yes"
pi = "yes"
codex = { gap = 1279 }
goose = { gap = 784 }

[harness.request-usage]
what = "A call's requests are counted from its transcript once it ends: their context sizes and the cache they wrote"
claude-code = "yes"
pi = "yes"
codex = "yes"
goose = { gap = 784 }

[harness.usage-requests]
what = "`usage --item` and `--context` read a session's requests from its transcript"
claude-code = "yes"
pi = "yes"
codex = "yes"
goose = { gap = 784 }

[harness.usage-reads]
what = "`usage --reads` reads the files a session read and edited from its transcript"
claude-code = "yes"
pi = "yes"
codex = { cannot = "its rollout has no tool call that names a file it read", doc = "docs/facts/session-transcripts.md", says = "Codex rollout names no file a tool call read" }
goose = { gap = 784 }

[harness.tool-errors]
what = "A call's tool calls that failed are counted by what made them fail, from its transcript once it ends"
claude-code = "yes"
pi = "yes"
codex = { gap = 1279 }
goose = { gap = 784 }

[harness.failing-test-findings]
what = "A reviewer can attach a failing test to a finding"
claude-code = "yes"
pi = "yes"
codex = "yes"
goose = "yes"

[harness.reviewer-reads-repo]
