claude-code = "yes"
pi = "yes"
codex = "yes"
goose = "yes"

[harness.representative]
what = "Runs the representative's no-tool call that words a post"
claude-code = "yes"
pi = "yes"
codex = "yes"
goose = "yes"

[harness.triager]
what = "Runs the triager's read-only call that researches an issue, with the reviewer's reach"
claude-code = "yes"
pi = "yes"
codex = "yes"
goose = "yes"

[harness.retro]
