# A project's settings, read once when its runner starts. Every key is
# required except `max_items`, `review.local`, `pacing.enabled`,
# `worker.allowed_domains`, `worker.build_env`, `worker.instructions_file`,
# `worker.turn_timeout`, `ruling_channels` and `[preview]`, which a file
# written before them may leave out.
# This file holds the first build's defaults, for shep.

repo = "~/.kelpie/repos/shep"
forge = "shep-pm/shep"

# `ask` raises a ruling before every merge. `auto` merges once every gate
# passes and posts a notice to the webhook after; every other ruling still
# asks.
merge_authority = "ask"

# Whether the repo runs CI on pull requests. GitHub cannot tell a repo
# with no CI from checks not registered yet, so a repo without CI says so.
ci = true

# How many work items may be open at once. Each has its own branch,
# worktree and gates, and the worker's turns still run one at a time.
max_items = 1

# How rulings reach the maintainer: `webhook`, `relay` (the Claude app on the
# phone) or both. Over `ruling_channels` in `~/.kelpie/settings.toml`, and both
# when neither says. A project with no `webhook` in it needs no webhook in
# that file, and one with no `relay` never starts a relay.
# ruling_channels = ["webhook", "relay"]

# Left out of a pull request's changed-line count.
generated = [
    "Cargo.lock",
    "**/snapshots/*.snap",
    "web/src/data/cli-reference.generated.txt",
]

[models.worker]
model = "claude-sonnet-5"
effort = "medium"

[models.reviewer]
model = "claude-sonnet-5"
effort = "medium"

[models.judge]
model = "claude-opus-5-5"
effort = "low"

[models.relay]
model = "claude-haiku-4-5-20251001"
effort = "low"

[review]
loop_guard = 8

# The local round, which alternates with the Claude round, local first. The
# README says what each kind does. `off` runs the Claude round alone.
# `endpoint` is kelpie's own reviewer: any OpenAI-compatible server (Ollama,
# LM Studio, llama.cpp's server), its model, and the context size the server
# gives that model, in tokens. `command` runs a command that keeps the
# README's contract, here the maintainer's own qwen-review script, as one
# example. `gpu_lease = true` has kelpie hold the GPU lock around each round;
# leave it off for a command that takes the lock itself, as that script does.
# A missing command or an unreachable endpoint stops the runner. A file
# without this table runs `~/.claude/scripts/qwen-review.sh`.
[review.local]
kind = "command"
command = "~/.claude/scripts/qwen-review.sh"

# [review.local]
# kind = "endpoint"
# url = "http://localhost:11434/v1"
# model = "qwen2.5-coder:14b"
# context = 32768
# gpu_lease = true

# [review.local]
# kind = "off"

# CodeRabbit's free plan reviews public repos only. Turn this off for a
# private repo, which then goes from the review loop and CI straight
# to the merge ruling.
[coderabbit]
enabled = true
divisor = 1000

# Turn `enabled` off for a stretch when usage limits do not matter: neither
# the daily allowance nor the 5-hour window then holds anything, and `status`
# says pacing is off. Usage is still read and shown.
[pacing]
enabled = true
kickoff_hours = 8

# Domains a worker's sandbox may reach besides GitHub: here the crates
# registry, for a cold cargo cache. `build_env` points tool caches into the
# worker's build folder, such as `BUN_INSTALL_CACHE_DIR = "bun"` for bun.
# `CARGO_TARGET_DIR` is always the build folder itself.
[worker]
allowed_domains = ["crates.io", "index.crates.io", "static.crates.io"]
build_env = {}

# A file of extra worker instructions, appended to kelpie's own: rules the
# repo's docs don't carry. `~/` is the home folder, and a relative path is
# taken from this file's folder. A missing file stops the runner. Left out
# here, so shep's first-build defaults carry none.
# instructions_file = "~/.kelpie/projects/shep/worker-instructions.md"

# A worker turn still running at this ceiling is more likely stuck than
# busy: kelpie stops it, parks it and asks. A yes resumes the same session.
turn_timeout = 60

[[worker.guard_hooks]]
event = "PreToolUse"
matcher = "Bash"
command = "node ~/.claude/hooks/git-gh-guard.js"

# Only for a repo with `.claude/launch.json`, which shep has none of. Kelpie
# starts that file's dev server to take its shots, and gives workers the
# Playwright MCP server. `configuration` is the file's first when absent,
# `routes` is ["/"], and `domains`, the hosts the app itself calls, is empty.
# [preview]
# configuration = "dev"
# routes = ["/", "/events"]
# domains = ["pokemon-go-api.github.io", "leekduck.com", "*.leekduck.com"]
