# A project's settings, read once when its runner starts. Every key is
# required except `pacing.enabled`, `worker.allowed_domains`,
# `worker.build_env`, `worker.instructions_file`, `worker.turn_timeout` and
# `[preview]`, which a file written before them may leave out.
# This file holds the first build's defaults, for shep.

repo = "~/.kelpie/repos/shep"
forge = "shep-pm/shep"

# `ask` raises a ruling before every merge. `auto` merges once every gate
# passes and posts a notice to the webhook after; every other ruling still
# asks.
merge_authority = "ask"

# Whether the repo runs CI on pull requests. GitHub cannot tell a repo
# with no CI from checks not registered yet, so a repo without CI says so.
ci = true

# Left out of a pull request's changed-line count.
generated = [
    "Cargo.lock",
    "**/snapshots/*.snap",
    "web/src/data/cli-reference.generated.txt",
]

[models.worker]
model = "claude-sonnet-5"
effort = "medium"

[models.reviewer]
model = "claude-sonnet-5"
effort = "medium"

[models.judge]
model = "claude-opus-5-5"
effort = "low"

[models.relay]
model = "claude-haiku-4-5-20251001"
effort = "low"

[review]
loop_guard = 8

# CodeRabbit's free plan reviews public repos only. Turn this off for a
# private repo, which then goes from the qwen-review loop and CI straight
# to the merge ruling.
[coderabbit]
enabled = true
divisor = 1000

# Turn `enabled` off for a stretch when usage limits do not matter: neither
# the daily allowance nor the 5-hour window then holds anything, and `status`
# says pacing is off. Usage is still read and shown.
[pacing]
enabled = true
kickoff_hours = 8

# Domains a worker's sandbox may reach besides GitHub: here the crates
# registry, for a cold cargo cache. `build_env` points tool caches into the
# worker's build folder, such as `BUN_INSTALL_CACHE_DIR = "bun"` for bun.
# `CARGO_TARGET_DIR` is always the build folder itself.
[worker]
allowed_domains = ["crates.io", "index.crates.io", "static.crates.io"]
build_env = {}

# A file of extra worker instructions, appended to kelpie's own: rules the
# repo's docs don't carry. `~/` is the home folder, and a relative path is
# taken from this file's folder. A missing file stops the runner. Left out
# here, so shep's first-build defaults carry none.
# instructions_file = "~/.kelpie/projects/shep/worker-instructions.md"

# A worker turn still running at this ceiling is more likely stuck than
# busy: kelpie stops it, parks it and asks. A yes resumes the same session.
turn_timeout = 60

[[worker.guard_hooks]]
event = "PreToolUse"
matcher = "Bash"
command = "node ~/.claude/hooks/git-gh-guard.js"

# Only for a repo with `.claude/launch.json`, which shep has none of. Kelpie
# starts that file's dev server to take its shots, and gives workers the
# Playwright MCP server. `configuration` is the file's first when absent,
# `routes` is ["/"], and `domains`, the hosts the app itself calls, is empty.
# [preview]
# configuration = "dev"
# routes = ["/", "/events"]
# domains = ["pokemon-go-api.github.io", "leekduck.com", "*.leekduck.com"]
