# Kelpie's own settings, shared by every project, at `~/.kelpie/settings.toml`.
# Read when a runner starts. Every key is required.

# Every ruling is also posted here, so the maintainer hears of it away from
# the terminal. `kind` is `discord` (a channel's webhook URL) or `ntfy` (a
# topic's URL). The URL is a credential: anyone holding it can post, or read
# an ntfy topic. Keep this file private.
[webhook]
kind = "ntfy"
url = "https://ntfy.sh/your-private-topic"
