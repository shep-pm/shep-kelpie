# A project's runner, as its `[[app]]` entry in your shepherd's Flockfile. The project's
# settings are the sheep's `[app.dogs.kelpie]` table: shep keeps it and hands
# it to the runner, and lookout edits it in the sheep's pane. Every key is
# required except `max_items`, `review`, `pacing.enabled`,
# `worker.allowed_domains`, `worker.build_env`, `worker.instructions_file`,
# `worker.turn_timeout`, `pull_request_reviewers`,
# `skills` and `agents`, which a table written
# before them may leave out. This entry holds the first build's defaults, for
# shep.

[[app]]
name = "shep"
script = "/path/to/kelpie" # the dog's path (`shep dogs`), e.g. ~/.cargo/bin/shep-kelpie, which `upgrade` replaces
args = ["runner", "shep"]
env = { SHEP_HOME = "/path/to/home/.shep" }
channel = true
shutdown_with_message = true
kill_timeout = "10s"

[app.dogs.kelpie]
repo = "~/GitHub/shep" # the checkout `shep kelpie add` ran in
forge = "shep-pm/shep"

# `ask` raises a ruling before every merge. `auto` merges once every gate
# passes and sends a notice after, to the webhook, or the log when kelpie has none;
# every other ruling still asks.
merge_authority = "ask"

# Whether the repo runs CI on pull requests. GitHub cannot tell a repo
# with no CI from checks not registered yet, so a repo without CI says so.
ci = true

# How many work items may be open at once. Each has its own branch,
# worktree and gates, and the worker's turns still run one at a time.
max_items = 1

# The pull request reviewers a round may summon, in preference order, from
# those kelpie's `[kelpie.reviewers]` define. Each round goes to the first
# whose window is free, so a pull request waiting on CodeRabbit's hour takes
# a cubic or Codex round instead. `coderabbit` alone when absent.
# pull_request_reviewers = ["coderabbit", "cubic", "codex"]

# Left out of a pull request's changed-line count.
generated = [
    "Cargo.lock",
    "**/snapshots/*.snap",
    "web/src/data/cli-reference.generated.txt",
]

# Words that stay off the forge, whatever their case: kelpie posts no text
# naming one, and a worker's commits and `gh` calls may not either. Each entry
# is a literal word or phrase, matched as a whole word. A CI check's list is
# often a regex, which this is not: spell out each name it would match.
# private_names = ["Acme Corp"]

[app.dogs.kelpie.models.worker]
model = "claude-sonnet-5-5"
effort = "high"

[app.dogs.kelpie.models.reviewer]
model = "claude-sonnet-5"
effort = "medium"

# The deep review round, a new project's review: two fresh sessions that read
# the whole pull request for defects, the second shown what the first found.
# Both run on this role.
[app.dogs.kelpie.models.deep_reviewer]
model = "claude-opus-5-5"
effort = "high"

# The model id each `worker:<model>-<effort>` label's name runs. Each name
# keeps the id shown here when left out.
# [app.dogs.kelpie.models.labels]
# opus = "claude-opus-5-5"
# sonnet = "claude-sonnet-5-5"
# haiku = "claude-haiku-4-5-20251001"
# fable = "claude-fable-5-1"

# The agent each role runs on, from those kelpie's `[kelpie.agents]` define,
# over its `models` entry. A role left out keeps `models` on Claude Code.
# [app.dogs.kelpie.agents]
# worker = "opus-high"
# reviewer = "opus-high"
# deep_reviewer = "opus-high"

[app.dogs.kelpie.review]
# The reviewers, in order, each run once: `deep`, the project's own deep round
# on `models.deep_reviewer`, `claude`, its own Claude round on
# `models.reviewer`, and the ones kelpie's `[kelpie.local_reviewers]` define.
# After each one that finds anything above a nit, the worker gets one turn to
# fix all of that reviewer's findings; a round of nits, or of nothing, goes
# straight to the next. After the last, the pull request goes to CI. A
# reviewer limited to `paths` runs only on a pull request that changes one of
# them. Absent or empty, a new project's review is the maintainer's
# qwen-review script when it is there, and then the deep round:
# two fresh sessions read the whole pull request for defects, and what they
# find goes to the worker as any reviewer's findings do. `review.local`
# below, set, runs that round and then `claude`.
#
# A local model alone:
# reviewers = ["qwen"]
# A Claude round alone:
# reviewers = ["claude"]
# Both, and a deeper Claude round on the paths `opus` lists:
# reviewers = ["qwen", "claude", "opus"]
# The local model and then the deep round, which is the default:
# reviewers = ["qwen", "deep"]

# The older form of the local round, which runs before `claude` and cannot be
# set beside `reviewers`. A runner on it says so at start. `kind` is `off`, or
# `endpoint` or `command` with the keys a `[kelpie.local_reviewers]`
# definition of that kind takes.
# [app.dogs.kelpie.review.local]
# kind = "command"
# command = "~/.claude/scripts/qwen-review.sh"

# The rounds of every pull request reviewer listed above. CodeRabbit's free
# plan reviews public repos only, so a private repo lists only cubic or
# turns this off, and then goes from the review and CI straight to the
# merge ruling. The cap counts rounds from every reviewer.
[app.dogs.kelpie.coderabbit]
enabled = true
divisor = 1000
# A fixed number of rounds per pull request, in place of the divisor's cap of
# ceil(changed lines / divisor) + 1. The last round's open threads go to the
# worker, and its fix goes to CI and the merge with no further summon.
# rounds = 1

# Turn `enabled` off for a stretch when usage limits do not matter: neither
# the daily allowance nor the 5-hour window then holds anything, and `status`
# says pacing is off. Usage is still read and shown.
[app.dogs.kelpie.pacing]
enabled = true
kickoff_hours = 8

# Domains a worker's sandbox may reach besides GitHub: here the crates
# registry, for a cold cargo cache. `build_env` points tool caches into the
# worker's build folder, such as `BUN_INSTALL_CACHE_DIR = "bun"` for bun.
# `CARGO_TARGET_DIR` is always the build folder itself.
[app.dogs.kelpie.worker]
allowed_domains = ["crates.io", "index.crates.io", "static.crates.io"]
build_env = {}

# A file of extra worker instructions, appended to kelpie's own: rules the
# repo's docs don't carry. `~/` is the home folder, and a relative path is
# taken from the project's folder in kelpie's home,
# `$SHEP_HOME/kelpie/<project>/`. A missing file stops the runner. Left out
# here, so shep's first-build defaults carry none.
# instructions_file = "~/.shep/kelpie/shep/worker-instructions.md"

# A worker turn still running at this ceiling is more likely stuck than
# busy: kelpie stops it, parks it and asks. A yes resumes the same session.
turn_timeout = 60

# A project's own hooks, run after kelpie's guard, which every worker gets.
# Each command must resolve when the runner starts: its program on `PATH`
# or at its path, and every argument that is a path must exist.
# [[app.dogs.kelpie.worker.guard_hooks]]
# event = "PreToolUse"
# matcher = "Bash"
# command = "~/bin/lint-guard"

# The skill each step runs. A step left out runs its default from kelpie's
# own copy of mattpocock/skills, so the project installs nothing; the README
# lists each step and its default. `path` is a skill folder of your own,
# `plugin` a skill in a Claude Code plugin's folder, and `none` runs kelpie's
# own prompt. A skill that cannot load runs kelpie's prompt too, and the log
# and `status` say why. Kelpie rewrites `$SHEP_HOME/kelpie/<project>/skills/`
# at every start, so a folder of your own inside it stops the runner.
# [app.dogs.kelpie.skills]
# review = { kind = "path", path = "~/skills/review" }
# ci = { kind = "plugin", plugin = "~/plugins/house", skill = "debug" }
# retro = { kind = "none" }
