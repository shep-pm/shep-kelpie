# A project's runner, as its `[[app]]` entry in your shepherd's Flockfile. The project's
# settings are the sheep's `[app.dogs.kelpie]` table: shep keeps it and hands
# it to the runner, and lookout edits it in the sheep's pane. Every setting
# sits in a table. `git.checkout`, `git.merging`, `ci.block` and
# `pacing.kickoff_hours` are required, with the `[git]`, `[ci]` and
# `[pacing]` tables that hold them. The `[worker]` table must be present too,
# though every key in it has a default, as does every other key.
# This entry holds the first build's defaults, for shep.
# `env` must hold `SHEP_HOME` as an absolute path, since a sheep starts
# without it. An older entry's `kill_timeout = "10s"` still works and is no
# longer needed.
# `shep kelpie get` prints a project's table and `shep kelpie set <key>
# <value>` changes one key. A running runner takes a change at its next
# wake, within a minute when idle. `git.checkout`, `git.remote`, `tickets` and
# kelpie's gateways wait for its next start, and the log says so.

[[app]]
name = "shep"
script = "/path/to/kelpie" # the dog's path (`shep dogs`), e.g. ~/.cargo/bin/shep-kelpie, which `upgrade` replaces
args = ["runner", "shep"]
env = { SHEP_HOME = "/path/to/home/.shep" }
channel = true
shutdown_with_message = true

[app.dogs.kelpie.git]
# The checkout `shep kelpie add` ran in.
checkout = "~/GitHub/shep"
# The repo on GitHub as `owner/name`. Left out, it is read from the
# checkout's `origin` when the runner starts, and an `origin` that is not a
# GitHub repo stops the runner, naming this setting.
remote = "shep-pm/shep"
# The branch the project's work goes into: work items branch from
# `origin/<base>`, their pull requests open against it and merge there.
# The repo's default branch when absent. Set it for a repo whose work
# happens on a long-lived branch that is not its default. `shep kelpie add
# --base <branch>` writes it. A change reaches the work items opened after it.
# base = "next"
# Who merges a green, reviewed pull request. `ask` raises a merge ruling.
# `auto` merges and sends a notice after, to the webhook, or the log when
# kelpie has none. Under `auto` some pull requests still get the merge
# ruling, which names why: one no reviewer read, one with a review bot's
# thread above a nit open, a head no review round read, a fix after a
# `no`, and a late bot round's fix.
merging = "ask"
# Findings a worker deferred, once its pull request merges. `ask` raises a
# ruling before filing them as issues, `file` files them at once, and
# `skip` files nothing and leaves them in the review. `ask` when absent.
issues = "ask"
# The GitHub login kelpie mentions on a ruling it posts through its App, so
# GitHub notifies you. The login `gh` acts as when absent, so set this when
# that is not you, such as a bot account.
# maintainer = "octocat"

[app.dogs.kelpie.ci]
# Whether the repo runs CI on pull requests, which a merge waits for green
# on. GitHub cannot tell a repo with no CI from checks not registered yet,
# so a repo without CI says so. Off, kelpie reads no checks at all and the
# review starts at once. On, no reviewer reads a head until CI has passed on
# it, so CI must run on the draft pull request too.
block = true
# How many fix turns the worker gets on red runs for one work item before
# kelpie raises a ruling. 0 raises it on the first red run, and -1 sets no
# cap. A head red twice with nothing pushed raises it whatever this is.
fix_attempts = -1
# How many minutes a check may sit queued or in progress before kelpie reruns
# its workflow run, counted from when it began waiting on the head. GitHub
# sometimes leaves one job of a finished run queued or in progress for good. A
# rerun gets one more of these, and a check still waiting after that raises a
# `check-queued` ruling. The forge refuses a rerun of a run still going, so a
# check that is really running is not rerun for being slow. A head with no check
# at all raises a `no-checks` ruling after this long when `origin/main` has a
# workflow that runs on a pull request, and goes on as skipped at once when it
# has none.
queued_minutes = 60
# A command that runs one failing test a reviewer wrote, which a reviewer on
# Claude Code is then asked to leave for each finding it can. It must hold
# `{test}`, the file's path in the repo, or `{name}`, the file's name without
# its extension. Absent, no reviewer is asked for a test.
# test_command = "cargo test --test {name}"

[app.dogs.kelpie.concurrency]
# How many work items may hold a slot, which a worker's turn or a review
# needs. Each has its own branch, worktree and gates. With more than one,
# their turns and reviews run at the same time, one call at a time per work
# item. One parked on a ruling gives its slot up.
active_items = 1
# How many work items may wait parked on rulings before the board opens
# nothing new. It is not a cap on rulings: items already working can still
# park past it, and a merged item on its follow-up ruling does not count.
# 0 opens nothing while any ruling waits, and opens work as ever while none
# does.
pending_rulings = 2

[app.dogs.kelpie.budget]
# What one work item may spend, in dollars, on its worker's and reviewers'
# priced calls together. Past it, the work item raises a `stuck` ruling for
# `over-budget` before its worker's next turn starts, and a turn already
# running is never cut off. A yes doubles the cap, and again while it is
# still below the spend (one long turn can cost more than the doubled cap),
# and the worker carries on. A no with a note sends the worker the note
# ahead of the turn that was due, and raises the cap the same. A call whose
# harness reports no dollars counts nothing. The review rounds are not held
# back by it. A change takes effect at once, and `status` and the board show
# each open work item's spend against its cap. A cap below one cent is
# refused.
per_item_usd = 10

# The agents that build the project's work items, by the names of kelpie's
# agent files, `$SHEP_HOME/kelpie/agents/<name>.md`, which `shep kelpie add`
# writes out, a local model (`usage: none`) as well as any. An issue
# labelled `agent:<name>` runs on that one, listed here or not, as long as
# its file says `role: implementer`. Any other runs on the first listed.
# A work item keeps the agent it opened on, unless its first turn falls
# back (below). `sonnet-high` alone when absent.
[app.dogs.kelpie.agents]
implementers = ["sonnet-high"]
# The only agents this project may use, by the names of kelpie's agent
# files, for a private project that keeps its code to the models its owner
# names. With it set, no other agent is named or chosen: every setting that
# names an agent (`implementers`, `reviewers`, `pm`, `representative`,
# `contributions.reviewers`, `contributions.security_reviewer` and
# `triage.agent`) is refused when it names one left out, so is the default
# `reviewers`, and an `agent:<name>` label naming one is skipped. Names are
# not checked against the agents folder: a missing file is refused where the
# name is used. At least one name; leave it out to allow every agent, as
# when absent.
# allow = ["sonnet-high", "iq3-xxs-review", "defect-hunter-lite", "pm", "representative", "security-reviewer", "triager"]
# How an issue with no `agent:` label gets its implementer: `order`, where
# it runs on the first implementer listed and no call runs, the only choice
# and the default. `fallback_after` below still moves a first turn that
# waited past it.
# implementer_choice = "order"
# The agents that review each pull request, from the same files, whose
# role is `reviewer`: each reads it once, in this order. After each one that
# finds anything above a nit, the worker gets one turn to fix all of that
# reviewer's findings; a round of nits, or of nothing, goes straight to the
# next. After the last, the pull request goes to CI. A reviewer whose file
# sets `paths` runs only on a pull request that changes one of them.
# `defect-hunter-lite` is kelpie's own: Opus 5.5 at medium, reading for
# defects once. `defect-hunter` is the same prompt at high effort, which then
# looks again for what it missed, with one fix turn after both.
# `iq3-xxs-review` is kelpie's own too: a local model, `iq3_xxs`, behind the
# gateway named `paddock` in kelpie's settings. The review bots `coderabbit`, `cubic` and
# `codex` are reviewers too, on files `add` writes but lists nowhere: one
# listed here, as in `["iq3-xxs-review", "defect-hunter-lite", "coderabbit"]`, reads the
# pull request in its place, once a pass, after waiting for its window, and
# its open threads get the one fix turn. Each
# file holds its bot's window, and `rounds` there caps its reads of a work
# item's pull request. CodeRabbit's free plan reviews public repos only, so
# a repo GitHub marks private cannot list it. Absent, `iq3-xxs-review` where
# kelpie's settings hold a gateway named `paddock` and then `defect-hunter-lite`,
# with no bot; empty, no review at all.
# reviewers = ["iq3-xxs-review", "defect-hunter-lite"]
# The project manager, from a file whose role is `pm`: kelpie's own `pm` is
# Opus 5.5 at medium. Code wakes it when a slot is free with two or more
# ready issues, two open branches conflict, a work item is stuck, or you
# `shep kelpie tell` it something. It reads `board.md` and its own notes,
# never runs git or gh, and answers with a pick, holds, an unstick or a
# reply, which kelpie checks against the board before acting. One session
# is kept across its wakes and compacted past 100k tokens of context.
# Absent, the board's rule picks (priority, then age) and a stuck item
# waits on its ruling, as it does whenever the project manager is down.
# pm = "pm"
# The representative's agent file, from a file whose role is `representative`:
# the voice of every post kelpie makes to a contributor, which words the facts
# kelpie's code drafted and reads and runs nothing. It runs on any harness.
# `representative` when absent. Only a project whose `contributions.pick` is
# not `off` needs the file, and a missing or mis-roled one stops the runner.
# representative = "representative"
# Minutes a work item's first turn may wait for its model with no output
# before it stops and moves to the next implementer listed that no other
# item waits on. A later turn never moves, nor does an item labelled with a
# `!` at the end, as `agent:opus-high!`, nor one whose agent
# `agents.implementers` does not list. Off when absent.
# fallback_after = 15

# Turn `enabled` off for a stretch when usage limits do not matter: neither
# the daily allowance nor the 5-hour window then holds anything, and `status`
# says pacing is off. Usage is still read and shown. `kickoff_hours` is the
# hours a day that the per-hour figure in `status` divides the day's
# allowance by.
[app.dogs.kelpie.pacing]
enabled = true
kickoff_hours = 8

# Domains a worker's sandbox may reach besides GitHub: here the crates
# registry, for a cold cargo cache. An entry is a host such as `crates.io`,
# with one optional leading `*.` label (`*.crates.io`) and an optional
# `:port`; a `*` anywhere else, such as `productionresultssa*.blob.core.windows.net`,
# a scheme or a path is refused when the settings load, since the sandbox would
# refuse to start on them: a live reread keeps the running settings and names
# the entry. `build_env` points tool caches into the
# worker's build folder, such as `BUN_INSTALL_CACHE_DIR = "bun"` for bun.
# `CARGO_TARGET_DIR` is always the build folder itself. Every call that works
# the item reads the unpacked crates of a `CARGO_HOME` there and the standard
# library and docs of a `RUSTUP_HOME` there, as it reads the machine's own
# installed dependency and toolchain sources. kelpie makes each of those folders
# in the build folder as it grants it, so the first call reads what its own tool
# installs while it runs.
[app.dogs.kelpie.worker]
allowed_domains = ["crates.io", "index.crates.io", "static.crates.io"]
build_env = {}

# While on, a call that works an item also reaches the registries of the
# package managers its worktree keeps a lockfile or manifest for, in its root
# or a folder directly under it, so `allowed_domains` names hosts beyond them:
# npm, pnpm and bun (`registry.npmjs.org`), yarn (`registry.yarnpkg.com` and
# `registry.npmjs.org`), cargo (`crates.io`, `index.crates.io`,
# `static.crates.io`), go (`proxy.golang.org`, `sum.golang.org`), and uv and
# pip (`pypi.org`, `files.pythonhosted.org`). On when absent; off, only
# `allowed_domains` adds hosts. `doctor` names each manager it finds and how
# its registry is reached.
package_registries = true

# A file of extra worker instructions, appended to kelpie's own: rules the
# repo's docs don't carry. `~/` is the home folder, and a relative path is
# taken from the project's folder in kelpie's home,
# `$SHEP_HOME/kelpie/<project>/`. A missing file stops the runner. Left out
# here, so shep's first-build defaults carry none.
# instructions_file = "~/.shep/kelpie/shep/worker-instructions.md"

# A worker turn still running at this ceiling is more likely stuck than
# busy: kelpie stops it, parks it and asks. A yes resumes the same session.
# In minutes.
turn_timeout = 60

# Tokens of context at which Claude Code compacts a worker's session in the
# middle of a turn. Left alone it waits for the model's whole window, and a
# long turn can read hundreds of thousands of tokens on every call by then.
# After a compaction the worker is handed the turn's prompt again. 0 leaves
# Claude Code's own point. Reviewers and the project manager are not bounded.
compact_window = 200000

# A project's own hooks, run after kelpie's guard, which every worker gets.
# Each command must resolve when the runner starts: its program on `PATH`
# or at its path, and every argument that is a path must exist.
# [[app.dogs.kelpie.worker.guard_hooks]]
# event = "PreToolUse"
# matcher = "Bash"
# command = "~/bin/lint-guard"

# The project's own checks, which kelpie runs itself for every harness and
# role, where `worker.guard_hooks` reach a Claude Code worker alone. A point
# is one of these. Gates, which can refuse: `publish` (any text before it goes
# to the forge, kelpie's own included), `commit` (a worker's message and staged
# diff), `push` (the commits being pushed), `handover` (a worker's finished
# branch, before review), `command` (every shell command an agent runs),
# `write` (every file an agent writes or edits), `after_command` (a shell
# command's result, as feedback to the agent), `turn_start` (a prompt kelpie
# is about to send) and `turn_end` (a worker's turn that ended). Notices,
# which only tell: `reset` (before kelpie compacts a session), `ruling`, `ci`
# and `done`. The command gets a JSON
# payload on stdin. At a gate, exit 0 passes, 2 refuses with its stderr as the
# reason, and anything else is a hook that failed, which also refuses. A
# notice that exits non-zero or hangs is logged by name and kelpie goes on. A hook that
# runs past 30 seconds has failed. Each command must resolve when the runner
# starts, as a guard hook's must, and a change that adds one that does not is
# refused. A call or a write already running finishes under the hooks it
# started with. A point that is not one of these stops the
# runner at load, naming the points there are.
# The payload carries what the point is about: `command` has the `command`
# line and its `cwd`; `write` the `path`, `tool` and `content` or `patch`;
# `after_command` the `exit` and the output tail; `turn_end` the
# `last_message`; `ruling` the `kind`, `question` and `choices`; `ci` the
# `head`, its `conclusion` and the `failed` checks; `done` the work item's
# `history` entry.
# `commit`, `push`, `command`, `write`, `after_command` and a worker's
# `publish` run inside kelpie's sandbox, in the worker's fence, so they read
# only what the worker can. The rest run in the runner, outside it.
# A refused commit, push, command, write or `gh` post goes back to the agent
# as the tool's error, a refused `after_command` as feedback on the result,
# and a refused pull request file, branch or `turn_end` back to the worker
# once. A refused `turn_start`, or a post of kelpie's own, parks on a ruling
# naming the hook.
# Use `hooks` for a check that must hold on every harness, and
# `worker.guard_hooks` for a Claude Code hook on a tool call kelpie has no
# point for.
# [[app.dogs.kelpie.hooks]]
# point = "publish"
# command = "~/bin/check-words"

# A git gate is a `command` hook: it reads the whole shell line from the
# payload's `command`, and refuses what it finds there with exit 2.
# [[app.dogs.kelpie.hooks]]
# point = "command"
# command = "~/bin/git-gate"

# The host that runs the project's end-to-end tests, which a worker cannot run
# in its sandbox. A worker asks for a run with `kelpie lease e2e`: the dog
# copies the worktree to `host`, runs `command` there and copies `results`
# back, one run at a time. `host` is an ssh alias from your ssh config, and
# `command` is a file in the repo and `results` a folder in it, both relative
# with no `..`. The host must be disposable: the project's script runs there
# as the alias's account, and a worker edits that script. Left out, a worker's
# ask is answered that the project has no e2e host. A runner reads these
# when it starts. See https://github.com/shep-pm/shep-kelpie/blob/main/docs/guide/leases-and-e2e.md#end-to-end-tests.
# [app.dogs.kelpie.e2e]
# host = "e2e-box"
# command = "scripts/e2e-remote.sh"
# results = "test-results"

# Which kinds of ruling the project manager answers for you, once `pm` names
# it. `pm_decides` maps each kind to `true`, which it answers, or `false`,
# which you answer; a kind it leaves out is yours. A ruling left to it waits up
# to one wake for its answer. An option it picks is applied and posted on the
# ruling's thread, where `<id> no <note>` reopens it; an abstention, a `design`
# flag, a merge under `git.merging = "ask"` or an option only you can carry
# out comes to you with its pick. A question and a follow-up have wakes of
# their own, whatever their value. `merge`, `security`, `contribution-merge`
# and `local-model-spilled` are refused as `true`, and are never written.
# `shep kelpie add`, `upgrade` and `shep kelpie settings migrate` write each
# other kind it is missing, at the value below, and never change one it has.
# The old `pm_alone` list still loads, as `true` for each kind it names, and
# the migration turns it into the map. It also deletes the panel's `decide`,
# `full_panel_paths`, `agents.advisor`, `agents.researcher` and `[researcher]`
# table, and `advisor` and `researcher` from `repo_setup.roles`, which the
# runner refuses.
# [app.dogs.kelpie.rulings.pm_decides]
# question = false
# agent-files = false
# foreign-change = false
# follow-up = true
# rebase = true
# still-red = true
# check-queued = true
# no-checks = true
# merge-refused = true
# closed = true
# fix-not-pushed = true
# test-still-fails = true
# unpushed = true
# push-refused = true
# turn-timeout = true
# turn-failed = true
# adopt-failed = true
# over-budget = true

# Whether kelpie picks up other people's pull requests. `pick` is `off` (its
# own pull requests only), `label` (those the maintainer labels for it) or
# `all`. Anything but `off` needs the GitHub App to cover the repo, or the
# runner refuses to start: the representative would post as the maintainer.
# `reviewers` lists agent files, review bots welcome, in the order they run;
# the project's `agents.reviewers` when absent. `security_reviewer` is the
# reviewer agent that reads a contribution for security. `quiet_days` and
# `nudge_days` are whole days above 0, and `nudge_days` is below `quiet_days`.
# The agent files are checked only when `pick` is not `off`.
# `security_reviewer` is read when a contribution's head is; the other keys
# are not read yet.
# [app.dogs.kelpie.contributions]
# pick = "off"
# reviewers = ["defect-hunter-lite"]
# security_reviewer = "security-reviewer"
# quiet_days = 7
# nudge_days = 3

# Whether kelpie triages issues other people open. `pick` is `off`, `maintainer`
# (only issues the maintainer filed) or `all`. Anything but `off` needs the
# GitHub App to cover the repo, or the runner refuses to start: the triager's
# words would post as the maintainer. Only issues opened after `pick` was turned
# on are listed, and `status` lists them under `triage.due`; nothing is posted
# or labelled yet. `wait_days` is whole days above 0 without a word from the
# author before kelpie treats the triage as unanswered. `max_questions` is 1 to
# 10, the most one comment asks. `agent` is an agent file whose role is
# `triager`. The agent file is checked only when `pick` is not `off`. A change
# waits for the runner's next start. `hand_ready` (off when absent) takes back
# an open issue the maintainer opened after `pick` was turned on and labelled
# `ready-for-agent` by hand, when it has no triage record, no work item and no
# open pull request: kelpie saves a record, then swaps the label for
# `needs-triage`, before the board's pick, and the pass asks its questions and
# puts `ready-for-agent` back once the issue check passes its rewrite. It needs
# `pick` to be `maintainer` or `all`, and any worker gets the issue after.
#
# Whatever `pick` says, kelpie runs the issue check on each new or edited open
# issue. The maintainer's issue that passes is labelled `ready-for-agent`, and
# anyone else's waits at `needs-triage`. Only an issue that fails is triaged.
#
# Four limits are checked before any issue's research call, so a burst of issues
# or one noisy author cannot spend the triager's budget. Each is 0 for off, and
# the maintainer's own issues and `shep kelpie triage <issue>` skip all four.
# `per_day` is the most triage calls in any 24 hours: an issue past it stays in
# `triage.due` for the next free place and is never dropped. `per_author_per_day`
# is the most triage calls on one author's issues in any 24 hours: an issue past
# it is labelled `needs-triage` with no call and no comment. `min_account_days`
# is the age in days an author's account must reach, and one younger, with no
# history in the repo, is labelled `needs-triage` the same way. `max_body_kb` is
# the most of an issue body the triager is given, cut at that size with a line
# in the fence saying it was cut and how long it was; the title is never cut.
# [app.dogs.kelpie.triage]
# pick = "off"
# hand_ready = false
# wait_days = 7
# max_questions = 10
# agent = "triager"
# per_day = 10
# per_author_per_day = 2
# min_account_days = 30
# max_body_kb = 20
#
# What the triager may ask an author depends on who they are. The forge's
# association sets it: `OWNER` and the maintainer's own login are asked as the
# `maintainer`, `MEMBER`, `COLLABORATOR` and `CONTRIBUTOR` as a `developer`, and
# the rest as a `reporter`. `authors` gives a login a role of its own in place of
# that, since the association says how someone relates to the repo and not what
# they can answer: a collaborator who tests the app can only say what they saw.
# Logins are compared ignoring case, and any other word is refused naming
# `triage.authors`.
# authors = { "qc-tester" = "reporter" }
#
# A text classifier the project's gateway can be asked before an issue's research
# call, so a spam issue costs a classifier call and no comment. `gateway` is a
# gateway from `[gateways.<name>]` in kelpie's own settings, and no gateway means
# no check. `path` is the classifier's route on it, and is needed beside
# `gateway`. `threshold` is the probability from 0 to 1 at or above which the
# issue is read as spam. An issue read as spam gets the label `possible-spam`
# with no comment, no research call, no close and no lock: the maintainer
# decides. Asking for the issue with `shep kelpie triage <issue>` skips the check
# and takes `possible-spam` off, the ask being the maintainer's answer to the
# read. A gateway that cannot be reached is told once and the check is off for
# the rest of the run, with the limits still holding, and an answer kelpie cannot
# read is told once with the check left on. The maintainer's own issues skip the
# check.
# [app.dogs.kelpie.triage.spam]
# gateway = "paddock"
# path = "/classify"
# threshold = 0.8

# Whether kelpie merges the bumps bots open. `pick` is `off` (every bot's pull
# request is left alone) or `on`. A bump behind `main` is asked to rebase once
# per head, and is proved only on the latest `main`: its checks must pass, as
# at the merge gate. A bump that changes a path in `web` (a path ending in `/`
# is a folder) also needs a passing e2e run through the dog's e2e host, and is
# never merged without one. A proved bump is merged with a merge commit, with
# no review. `bots` are the logins whose pull requests are bumps, ignoring case
# and a `[bot]` suffix. A bump that fails a check or its e2e run, or whose
# checks are still pending or absent after `wait_hours` (above 0), is red:
# `on_red = "close"` comments what failed, closes it and files an issue, and
# `"leave"` logs it and leaves it open.
# [app.dogs.kelpie.dependencies]
# pick = "off"
# bots = ["dependabot"]
# on_red = "close"
# web = ["web/", "package.json"]
# wait_hours = 24

# The skill each step runs. A step left out runs its default from kelpie's
# own copy of mattpocock/skills, so the project installs nothing, except
# `triage`, `spec`, `reset` and `retro`: kelpie writes no skill for a step no
# call of its own runs yet, so those run kelpie's own prompt unless you name
# them, and a named `retro` is the project manager's batch retro.
# https://github.com/shep-pm/shep-kelpie/blob/main/docs/guide/building.md#skills
# lists each step and its default. `path` is a skill folder of your own, `plugin` a skill in a
# Claude Code plugin's folder, `kelpie` the step's default from kelpie's copy,
# and `none` runs kelpie's own prompt, or no retro at all. A skill that cannot load runs kelpie's prompt too, and the log
# and `status` say why. Kelpie rewrites `$SHEP_HOME/kelpie/<project>/skills/`
# at every start, so a folder of your own inside it stops the runner.
# [app.dogs.kelpie.skills]
# spec = { kind = "path", path = "~/skills/to-spec" }
# triage = { kind = "none" }
# implement = { kind = "path", path = "~/skills/implement" }
# tests = { kind = "kelpie" }
# ci_fix = { kind = "plugin", plugin = "~/plugins/house", skill = "debug" }
# pr = { kind = "none" }
# reset = { kind = "kelpie" }
# retro = { kind = "kelpie" }

# Which plugins, and which of the repo's own files, reach which calls. Kelpie
# loads each plugin the repo turns on in `.claude/settings.json` on its default
# branch into every call, and the repo's own `.claude/skills/`,
# `.claude/agents/`, `.claude/commands/` and the `hooks` of
# `.claude/settings.json` as one more plugin; this table narrows that and adds
# to it. Every key is optional. `plugins = false` loads none of the repo's
# plugins. `own = false` leaves the repo's own files out and keeps its plugins.
# A call in a worktree that matches the default branch loads those files from
# it, and does not get them twice. `roles` lists the calls that get plugins and
# the repo's own files, from `worker`, `reviewer` and `pm`,
# all of them when absent. `parts` lists which parts load, from `skills`,
# `agents`, `commands`, `hooks` and `mcp`, all of them when absent: a hook
# runs beside kelpie's own and cannot replace them.
# `mcp` adds the MCP servers of a plugin and of the repo's `.mcp.json` on its
# default branch to those calls; the hosts they reach need `allowed_domains`.
# `skip` lists plugins, as `name@marketplace`, left out though the repo turns
# them on. `extra` lists plugins the repo does not turn on, each as
# `name@marketplace` with its marketplace's source as one string:
# `github:owner/name`, `git:<url>` or `directory:<folder inside the checkout>`,
# with `#<branch or tag>` after a `github` or `git` address. `roles` narrows
# `extra` too, and `plugins = false` does not.
# [app.dogs.kelpie.repo_setup]
# plugins = true
# own = true
# roles = ["worker", "reviewer", "pm"]
# parts = ["skills", "agents", "commands", "hooks", "mcp"]
# skip = ["noisy@house"]
# extra = { "style@lab" = "github:acme/lab#v2" }

# Where the project's tickets live. `github` takes them from the repo's issues.
# `local` takes them from markdown files in `tickets/` in the project's folder
# of kelpie's home, which `shep kelpie ticket new|list|show|edit|close` files and
# reads: a ticket's id is `k` and a counter (`k1`), its branch is `kelpie/k1`,
# its pull request has no `Resolves` line, and kelpie closes it when the pull
# request merges. A project on `local` writes nothing to its repo but the
# branch and the pull request with its comments: it makes no label, comments
# on its tickets in the store, has no triage (`triage.pick` must be `off`), and
# refuses `adopt`.
[app.dogs.kelpie.tickets]
source = "github"

# A code graph of each work item's worktree for the reviewers' calls, served by
# codebase-memory-mcp: where a symbol is, what calls it, what it touches, in one
# call instead of a run of greps. `shep kelpie tools install` fetches the
# server, and a project that turns it on without it gets a doctor line and calls
# that run without a graph. Kelpie indexes the worktree before each call given
# it, keeps the index under `$SHEP_HOME/kelpie/<project>/code-graphs/`, and
# removes it with the worktree. The server runs inside the call's sandbox like
# everything else in it. `worker` adds the worker's own working turns, and is
# off: the server's 17 tool definitions ride in every request of every turn, and
# no worker session recorded so far, on Claude Code or pi, has answered one of
# them.
[app.dogs.kelpie.code_graph]
enabled = false
worker = false

# A browser for the worker's Claude Code and pi turns, to look at the UI it
# builds. Chromium cannot start inside the sandbox, so kelpie runs the
# Playwright MCP server outside it and the worker reaches it over a socket
# kelpie filters: only the browser tools in its allow-list pass, a URL passes
# only as `http` or `https` to one of `domains`, and a `filename` never does.
# Chromium itself resolves only `domains`, so every other host and every IP
# address fails. `shep kelpie tools install` fetches the server and Chromium,
# and a project that turns it on without them gets a doctor line. `domains` is
# a host, or `*.` and a parent for its subdomains. A port, an IP address and
# `localhost` are refused: Chromium cannot hold a host to one port.
# Kelpie also starts the project's dev server for each such turn, from
# `.claude/launch.json` as `main` has it, in a sandbox of its own that reaches
# `domains`, and stops it when the turn ends. The browser opens it at
# `http://localhost:<port>` and no other local address. `configuration` names
# the launch configuration to start, else the first one; a project with no
# launch file on `main` gets none.
# With `headed` on, the browser opens a window you can watch. macOS only: on
# Linux an enabled table stops the runner when it starts.
# A web bump (`dependencies.web`) on a project with the browser is also proved
# here: kelpie starts the dev server in the bump's checkout, headless whatever
# `headed` says, and opens each of `routes` (each starting with `/`, `["/"]` by
# default). A route fails when the page does not load, a request to the dev
# server answers 5xx, or the console logs an error.
[app.dogs.kelpie.browser]
enabled = false
headed = false
domains = []
# configuration = "web"
# routes = ["/"]

# A local round (a `command` or `endpoint` reviewer) writes its request and
# reply under the work item's build folder, which goes when the work item
# ends. With `keep` on, kelpie copies each round to
# `<folder>/<issue>-r<round>-<UTC time>/` when it ends, with a `round.json`
# saying what it was and how it ended, so a round can be replayed at another
# thinking limit. A round is about 250 KB. Rounds older than `keep_days` are
# removed when the runner starts and after each round it keeps; 0 keeps them
# all. `folder` is an absolute path or `~/` and a path, and defaults to
# `local-rounds/` in the project's kelpie folder. Removal touches only `folder`.
# [app.dogs.kelpie.local_rounds]
# keep = true
# keep_days = 30
# folder = "~/kelpie-local-rounds"

# A work item's build folder (`CARGO_TARGET_DIR`) is removed only when the work
# item ends, and one turn can fill a disk. While a turn runs, kelpie measures
# the folder and the disk's free space once a minute. Past `max_gb` in the
# folder, or under `min_free_gb` free on the disk that holds kelpie's home, the
# turn is paused at its next tool call (a harness with no pause hook, at its
# end). Kelpie then removes the cargo cache the ended turn did not touch
# (`incremental/` and `deps/` under each profile folder) and resumes the turn.
# Still over a limit, the turn is held and `status` says why. 0 turns a limit off.
# [app.dogs.kelpie.builds]
# max_gb = 20
# min_free_gb = 20
