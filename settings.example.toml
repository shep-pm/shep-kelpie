# A project's runner, as its entry in kelpie's Flockfile. The project's
# settings are the sheep's `[app.dogs.kelpie]` table: shep keeps it and hands
# it to the runner, and lookout edits it in the sheep's pane. Every key is
# required except `max_items`, `review.reviewers`, `review.local`,
# `review.local_rounds`, `pacing.enabled`,
# `worker.allowed_domains`, `worker.build_env`, `worker.instructions_file`,
# `worker.turn_timeout`, `ruling_channels`, `pull_request_reviewers`,
# `preview` and `skills`, which a table
# written before them may leave out. This entry holds the first build's
# defaults, for shep.

[[app]]
name = "shep"
script = "/path/to/kelpie"
args = ["runner", "shep"]
env = { SHEP_HOME = "/path/to/home/.kelpie/shep" }
channel = true
shutdown_with_message = true
kill_timeout = "10s"

[app.dogs.kelpie]
repo = "~/.kelpie/repos/shep"
forge = "shep-pm/shep"

# `ask` raises a ruling before every merge. `auto` merges once every gate
# passes and sends a notice after, to the webhook or the relay; every other
# ruling still asks.
merge_authority = "ask"

# Whether the repo runs CI on pull requests. GitHub cannot tell a repo
# with no CI from checks not registered yet, so a repo without CI says so.
ci = true

# How many work items may be open at once. Each has its own branch,
# worktree and gates, and the worker's turns still run one at a time.
max_items = 1

# How rulings reach the maintainer: `webhook`, `relay` (the Claude app on the
# phone) or both. Over `ruling_channels` in kelpie's `[kelpie]` section of
# `dogs.toml`, and both when neither says. A project with no `webhook` in it
# needs no webhook there, and one with no `relay` never starts a relay.
# ruling_channels = ["webhook", "relay"]

# The pull request reviewers a round may summon, in preference order, from
# those kelpie's `[kelpie.reviewers]` define. Each round goes to the first
# whose window is free, so a pull request waiting on CodeRabbit's hour takes
# a cubic round instead. `coderabbit` alone when absent.
# pull_request_reviewers = ["coderabbit", "cubic"]

# Left out of a pull request's changed-line count.
generated = [
    "Cargo.lock",
    "**/snapshots/*.snap",
    "web/src/data/cli-reference.generated.txt",
]

# Words that stay off the forge, whatever their case: kelpie posts no text
# naming one, and a worker's commits and `gh` calls may not either. Each entry
# is a literal word or phrase, matched as a whole word. A CI check's list is
# often a regex, which this is not: spell out each name it would match.
# private_names = ["Acme Corp"]

[app.dogs.kelpie.models.worker]
model = "claude-sonnet-5"
effort = "medium"

[app.dogs.kelpie.models.reviewer]
model = "claude-sonnet-5"
effort = "medium"

[app.dogs.kelpie.models.judge]
model = "claude-opus-5-5"
effort = "low"

[app.dogs.kelpie.models.relay]
model = "claude-haiku-4-5-20251001"
effort = "low"

[app.dogs.kelpie.review]
loop_guard = 8
# The reviewers the loop runs, in order: `claude`, the project's own Claude
# round on `models.reviewer`, and the ones kelpie's `[kelpie.local_reviewers]`
# define. The loop ends once two rounds in a row, from two different
# reviewers, find nothing above a nit, and the nits are fixed with no
# further round. Where only one reviewer can run, one clean round ends it.
# A reviewer limited to `paths` runs only on a pull request that changes
# one of them. Absent or empty, the loop is the older `review.local` below
# and then `claude`: for a table with neither, the maintainer's qwen-review
# script and then Claude.
#
# A local model alone:
# reviewers = ["qwen"]
# Claude alone:
# reviewers = ["claude"]
# Both, and a deeper Claude round on the paths `opus` lists:
# reviewers = ["qwen", "claude", "opus"]

# At most this many rounds from local reviewers per work item. Once they are
# spent, only Claude reviewers run. No limit when absent.
# local_rounds = 1

# The older form of the local round, which alternates with `claude`, local
# first, and cannot be set beside `reviewers`. A runner on it says so at
# start. `kind` is `off`, or `endpoint` or `command` with the keys a
# `[kelpie.local_reviewers]` definition of that kind takes.
# [app.dogs.kelpie.review.local]
# kind = "command"
# command = "~/.claude/scripts/qwen-review.sh"

# The rounds of every pull request reviewer listed above. CodeRabbit's free
# plan reviews public repos only, so a private repo lists only cubic or
# turns this off, and then goes from the review loop and CI straight to
# the merge ruling. The cap counts rounds from every reviewer.
[app.dogs.kelpie.coderabbit]
enabled = true
divisor = 1000
# A fixed number of rounds per pull request, in place of the divisor's cap of
# ceil(changed lines / divisor) + 1. The last round's held findings go to the
# worker, and its fix goes to CI and the merge with no further summon.
# rounds = 1

# Turn `enabled` off for a stretch when usage limits do not matter: neither
# the daily allowance nor the 5-hour window then holds anything, and `status`
# says pacing is off. Usage is still read and shown.
[app.dogs.kelpie.pacing]
enabled = true
kickoff_hours = 8

# Domains a worker's sandbox may reach besides GitHub: here the crates
# registry, for a cold cargo cache. `build_env` points tool caches into the
# worker's build folder, such as `BUN_INSTALL_CACHE_DIR = "bun"` for bun.
# `CARGO_TARGET_DIR` is always the build folder itself.
[app.dogs.kelpie.worker]
allowed_domains = ["crates.io", "index.crates.io", "static.crates.io"]
build_env = {}

# A file of extra worker instructions, appended to kelpie's own: rules the
# repo's docs don't carry. `~/` is the home folder, and a relative path is
# taken from the project's folder,
# `~/.kelpie/projects/<project>/`. A missing file stops the runner. Left out
# here, so shep's first-build defaults carry none.
# instructions_file = "~/.kelpie/projects/shep/worker-instructions.md"

# A worker turn still running at this ceiling is more likely stuck than
# busy: kelpie stops it, parks it and asks. A yes resumes the same session.
turn_timeout = 60

# A project's own hooks, run after kelpie's guard, which every worker gets.
# Each command must resolve when the runner starts: its program on `PATH`
# or at its path, and every argument that is a path must exist.
# [[app.dogs.kelpie.worker.guard_hooks]]
# event = "PreToolUse"
# matcher = "Bash"
# command = "~/.kelpie/hooks/lint-guard"

# Off unless `enabled = true`, and then only for a repo with
# `.claude/launch.json` on `main`. Kelpie starts that file's dev server to
# take its shots, and gives workers the Playwright MCP server.
# `configuration` is the file's first when absent, `routes` is ["/"], and
# `domains`, the hosts the app itself calls, is empty.
# [app.dogs.kelpie.preview]
# enabled = true
# configuration = "dev"
# routes = ["/", "/events"]
# domains = ["pokemon-go-api.github.io", "leekduck.com", "*.leekduck.com"]

# The skill each step runs. A step left out runs its default from kelpie's
# own copy of mattpocock/skills, so the project installs nothing; the README
# lists each step and its default. `path` is a skill folder of your own,
# `plugin` a skill in a Claude Code plugin's folder, and `none` runs kelpie's
# own prompt. A skill that cannot load runs kelpie's prompt too, and the log
# and `status` say why. Kelpie rewrites `~/.kelpie/projects/<project>/skills/`
# at every start, so a folder of your own inside it stops the runner.
# [app.dogs.kelpie.skills]
# review = { kind = "path", path = "~/skills/review" }
# ci = { kind = "plugin", plugin = "~/plugins/house", skill = "debug" }
# retro = { kind = "none" }
