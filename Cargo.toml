[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/shep-pm/shep-kelpie"
publish = false

[workspace.dependencies]
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
shep-channel = { version = "=0.10.1", default-features = false, features = ["client"] }
toml = { version = "0.9", default-features = false, features = ["std", "parse", "serde"] }
# Only for throwaway homes and repos in tests
tempfile = { version = "3", default-features = false }

[workspace.lints.rust]
missing_docs = "deny"
missing_debug_implementations = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Debug info dominates a debug build, and dependencies never need theirs.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
