[workspace]
members = ["crates/*"]
# The root and every member, so `cargo fmt --all`, `clippy` and `test` run from
# the root cover the whole workspace.
default-members = [
    ".",
    "crates/adapters",
    "crates/client",
    "crates/core",
    "crates/disk",
    "crates/dog",
    "crates/facts",
    "crates/owner_only",
    "crates/process",
    "crates/protocol",
    "crates/runner",
    "crates/test_support",
    "crates/tree",
    "crates/trim",
    "crates/worker_folder",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/shep-pm/shep-kelpie"

[workspace.lints.rust]
missing_docs = "deny"
missing_debug_implementations = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
self_named_module_files = "deny"

[workspace.dependencies]
# The members below the root. A member's own manifest names none of them,
# except `test_support`, which every other member names as a dev-dependency.
shep-kelpie-adapters = { path = "crates/adapters" }
shep-kelpie-client = { path = "crates/client" }
shep-kelpie-core = { path = "crates/core" }
shep-kelpie-disk = { path = "crates/disk" }
shep-kelpie-dog = { path = "crates/dog" }
shep-kelpie-facts = { path = "crates/facts" }
shep-kelpie-owner-only = { path = "crates/owner_only" }
shep-kelpie-process = { path = "crates/process" }
shep-kelpie-protocol = { path = "crates/protocol" }
shep-kelpie-runner = { path = "crates/runner" }
shep-kelpie-test-support = { path = "crates/test_support" }
shep-kelpie-tree = { path = "crates/tree" }
shep-kelpie-trim = { path = "crates/trim" }
shep-kelpie-worker-folder = { path = "crates/worker_folder" }
# The sandbox runtime a macOS and Linux worker runs under: kelpie's own
# binary is its wrapper (`crabpot::run_from_args`), so no node `srt` is on
# that path. The library only, without the `crabpot` binary.
crabpot = { version = "0.2", default-features = false }
# The secret's random bytes, from the system's source on every platform
getrandom = { version = "0.4", default-features = false, features = ["std"] }
# The authenticator codes that answer a ruling from ntfy (RFC 6238 TOTP)
hmac = { version = "0.13", default-features = false }
# Zone-aware dates, for the reset times `/usage` prints in the maintainer's zone
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-zoneinfo"] }
# Opens and renames files below a worker's folders by descriptor, so a link
# the worker plants is refused; clears close-on-exec on a lease's connection,
# and so a command run under the lease holds it too. `tempfile` already
# builds it.
rustix = { version = "1", default-features = false, features = ["std", "fs", "process"] }
# The terminal QR code `shep kelpie totp` prints for an authenticator app to scan
qrcode = { version = "0.14", default-features = false }
# The settings' JSON Schema, in the version shep-client builds it with
schemars = { version = "1.2.2", default-features = false, features = ["derive", "std"] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
# Agent files' YAML frontmatter, in the version shep-core already builds
serde-saphyr = { version = "1", default-features = false, features = ["deserialize"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
sha1 = { version = "0.11", default-features = false }
shep-channel = { version = "=0.17.0", default-features = false, features = ["client"] }
# `schema` answers shep's `--schema` probe, which lookout edits kelpie's settings from
shep-client = { version = "=0.17.0", default-features = false, features = ["schema"] }
# Handover documents, for the slices of #656 that follow
shep-handover = "=0.17.0"
# Each member adds the features it uses
tempfile = { version = "3", default-features = false }
tokio = { version = "1", default-features = false }
toml = { version = "1.1", default-features = false, features = ["std", "parse", "display", "serde"] }
# A Windows job object holds a turn's process tree, which closes with it, and
# an ACL keeps a file to its owner. Disk calls read free and allocated bytes.
# The 0.61 line the lockfile already holds.
windows-sys = { version = "0.61", default-features = false, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }

[package]
name = "shep-kelpie"
description = "A shep dog that runs Claude Code workers from a planned work item to a merged pull request"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
readme = "README.md"
keywords = ["shep"]
# docs/ holds planning and design notes. They belong in the repository, not in
# a published .crate, which is permanent.
exclude = ["/docs/"]

[lints]
workspace = true

[dependencies]
shep-kelpie-adapters.workspace = true
shep-kelpie-client.workspace = true
shep-kelpie-core.workspace = true
shep-kelpie-disk.workspace = true
shep-kelpie-dog.workspace = true
shep-kelpie-facts.workspace = true
shep-kelpie-process.workspace = true
shep-kelpie-protocol.workspace = true
shep-kelpie-runner.workspace = true
shep-kelpie-tree.workspace = true
shep-kelpie-trim.workspace = true
shep-kelpie-worker-folder.workspace = true
crabpot.workspace = true
jiff.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
shep-channel.workspace = true
shep-client.workspace = true
shep-handover.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
toml.workspace = true

[dev-dependencies]
shep-kelpie-adapters = { workspace = true, features = ["test-support"] }
shep-kelpie-core = { workspace = true, features = ["test-support"] }
shep-kelpie-runner = { workspace = true, features = ["test-support"] }
shep-kelpie-test-support.workspace = true
# Only for the fake shepherds the tests run against
shep-client = { workspace = true, features = ["test-support"] }
# Only for throwaway homes and repos in tests
tempfile.workspace = true
# Only for tests that pause the clock
tokio = { workspace = true, features = ["test-util"] }

# Debug info dominates a debug build, and dependencies never need theirs.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
